<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#000000" />
  <title>Confirming your order | LADFOX</title>
  <script async src="https://www.googletagmanager.com/gtag/js?id=AW-18173399172"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag("js", new Date());
    gtag("config", "AW-18173399172");
  </script>
  <style>
    *{box-sizing:border-box}
    html{background:#000}
    body{margin:0;min-height:100svh;display:grid;place-items:center;background:#000;color:#fff;font-family:Manrope,Arial,sans-serif;padding:24px}
    .card{width:min(680px,100%);padding:clamp(30px,6vw,52px) clamp(22px,5vw,42px);border:1px solid #292929;border-radius:24px;text-align:center;background:#0b0b0b;box-shadow:0 24px 80px rgba(0,0,0,.4)}
    .eyebrow{margin:0 0 12px;color:#d8c18c;font-size:.76rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase}
    h1{margin:0 0 14px;font-size:clamp(2rem,7vw,3.7rem);line-height:1.03}
    p{color:#ccc;line-height:1.65;margin:10px 0}
    .details{margin:22px auto 0;padding:16px;border:1px solid #252525;border-radius:16px;background:#050505;text-align:left}
    .details p{margin:4px 0;font-size:.92rem}
    .details strong{color:#fff}
    .btn{display:inline-flex;margin-top:22px;padding:14px 20px;border-radius:999px;background:#f1e0b4;color:#181109;text-decoration:none;font-weight:800}
    .error{color:#ffb4b4}
    [hidden]{display:none!important}
  </style>
</head>
<body>
  <main class="card" aria-live="polite">
    <p class="eyebrow" data-eyebrow>Secure payment verification</p>
    <h1 data-title>Confirming your order…</h1>
    <p data-message>Please keep this page open while LADFOX verifies the payment directly with Stripe.</p>
    <div class="details" data-details hidden>
      <p><strong>Order:</strong> <span data-order-reference></span></p>
      <p><strong>Total paid:</strong> <span data-total></span></p>
      <p><strong>Specification:</strong> <span data-description></span></p>
      <p><strong>Confirmation email:</strong> <span data-email></span></p>
    </div>
    <a class="btn" href="index.html" data-home-link hidden>Return to LADFOX</a>
  </main>

  <script>
    (async function () {
      "use strict";
      const params = new URLSearchParams(window.location.search);
      const sessionId = params.get("session_id") || "";
      const title = document.querySelector("[data-title]");
      const eyebrow = document.querySelector("[data-eyebrow]");
      const message = document.querySelector("[data-message]");
      const details = document.querySelector("[data-details]");
      const homeLink = document.querySelector("[data-home-link]");
      const formatter = new Intl.NumberFormat("en-GB", { style:"currency", currency:"GBP" });

      const showError = (text) => {
        eyebrow.textContent = "Payment not confirmed";
        title.textContent = "We could not verify this order.";
        message.textContent = text;
        message.classList.add("error");
        homeLink.hidden = false;
      };

      if (!sessionId) {
        showError("No Stripe checkout reference was supplied. Please check your Stripe receipt or contact info@ladfox.com.");
        return;
      }

      try {
        const response = await fetch(`/.netlify/functions/get-checkout-session?session_id=${encodeURIComponent(sessionId)}`, {
          headers: { Accept: "application/json" }
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(result.error || "The payment could not be verified.");

        if (!result.paid) {
          eyebrow.textContent = "Payment processing";
          title.textContent = "Your payment is still being confirmed.";
          message.textContent = "Stripe has not marked the payment as paid yet. LADFOX will only begin the order after payment is confirmed.";
          homeLink.hidden = false;
          return;
        }

        eyebrow.textContent = "Payment confirmed";
        title.textContent = "Thank you for your order.";
        message.textContent = "Your secure payment has been received. LADFOX will contact you to confirm the centre stone and production details before manufacture begins.";
        document.querySelector("[data-order-reference]").textContent = result.orderReference || "Shown on your Stripe receipt";
        document.querySelector("[data-total]").textContent = formatter.format((result.amountTotal || 0) / 100);
        document.querySelector("[data-description]").textContent = result.description || "Signature Petal engagement ring";
        document.querySelector("[data-email]").textContent = result.customerEmail || "The address entered at checkout";
        details.hidden = false;
        homeLink.hidden = false;

        const purchaseKey = `ladfox_purchase_${sessionId}`;
        if (!sessionStorage.getItem(purchaseKey) && typeof window.gtag === "function") {
          window.gtag("event", "purchase", {
            transaction_id: result.orderReference || sessionId,
            currency: String(result.currency || "gbp").toUpperCase(),
            value: (result.amountTotal || 0) / 100,
            items: [{
              item_id: "signature-petal-collection",
              item_name: "Signature Petal Collection",
              price: (result.amountTotal || 0) / 100,
              quantity: 1
            }]
          });
          sessionStorage.setItem(purchaseKey, "1");
        }
      } catch (error) {
        showError(error instanceof Error ? error.message : "The payment could not be verified. Please contact info@ladfox.com.");
      }
    }());
  </script>
</body>
</html>
