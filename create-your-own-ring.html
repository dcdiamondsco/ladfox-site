  <title>Create Your Own Ring | LADFOX</title>
  <meta name="description" content="Create your own LADFOX ring. Choose metal, stone shape, size, colour, and clarity to start your bespoke design." />
  <link rel="canonical" href="https://ladfox.com/create-your-own-ring.html" />
  <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1" />
  <meta property="og:type" content="product" />
  <meta property="og:title" content="Create Your Own Ring | LADFOX" />
  <meta property="og:description" content="Start building your own LADFOX ring with the key options that shape the final design." />
  <meta property="og:url" content="https://ladfox.com/create-your-own-ring.html" />
  <meta property="og:image" content="https://ladfox.com/Images/Sketch%20with%20ring.png" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<body class="ring-config-page create-your-own-page">
  <header class="topbar">
    <div class="shell">
      <div class="brand-lockup">
        <a class="brand" href="index.html" aria-label="Ladfox home">
          <img class="brand-logo" src="Images/ladfox-logo.png" alt="Ladfox" />
        </a>
      </div>
      <div class="actions">
        <a class="btn btn-secondary" href="ring-gallery.html">Back to gallery</a>
        <a class="btn btn-primary" href="consultation.html">Book a consultation</a>
      </div>
    </div>
  </header>

  <main class="page">
    <div class="shell">
      <section class="layout" data-ring-config-page data-product-name="Create Your Own Ring" data-product-slug="create-your-own-ring">
        <article class="panel copy">
          <div class="size-panel">
            <div class="product-form-grid">
              <div class="field">
                <label for="customRingMetal">Metal</label>
                <div class="field-input">
                  <input class="config-hidden" id="customRingMetal" type="hidden" data-config-param="metal" value="" />
                  <div class="option-slider" data-option-slider="customRingMetal" aria-label="Metal">
                    <button class="option-pill option-pill--yellow-gold" type="button" data-option-value="14k Yellow Gold">14k Yellow Gold</button>
                    <button class="option-pill option-pill--yellow-gold" type="button" data-option-value="18k Yellow Gold">18k Yellow Gold</button>
                    <button class="option-pill option-pill--white-gold" type="button" data-option-value="14k White Gold">14k White Gold</button>
                    <button class="option-pill option-pill--white-gold" type="button" data-option-value="18k White Gold">18k White Gold</button>
                    <button class="option-pill option-pill--rose-gold" type="button" data-option-value="14k Rose Gold">14k Rose Gold</button>
                    <button class="option-pill option-pill--rose-gold" type="button" data-option-value="18k Rose Gold">18k Rose Gold</button>
                    <button class="option-pill option-pill--platinum" type="button" data-option-value="Platinum">Platinum</button>
                  </div>
                </div>
              </div>
              <div class="field field--wide">
                <label for="customRingShape">Stone shape</label>
                <div class="field-input">
                  <input class="config-hidden" id="customRingShape" type="hidden" data-config-param="shape" value="" />
                  <div class="option-slider" data-option-slider="customRingShape" aria-label="Stone shape">
                    <button class="option-pill" type="button" data-option-value="Round">Round</button>
                    <button class="option-pill" type="button" data-option-value="Oval">Oval</button>
                    <button class="option-pill" type="button" data-option-value="Pear">Pear</button>
                    <button class="option-pill" type="button" data-option-value="Cushion">Cushion</button>
                    <button class="option-pill" type="button" data-option-value="Emerald">Emerald</button>
                    <button class="option-pill" type="button" data-option-value="Radiant">Radiant</button>
                    <button class="option-pill" type="button" data-option-value="Princess">Princess</button>
                    <button class="option-pill" type="button" data-option-value="Marquise">Marquise</button>
                    <button class="option-pill" type="button" data-option-value="Asscher">Asscher</button>
                    <button class="option-pill" type="button" data-option-value="Heart">Heart</button>
                  </div>
                </div>
              </div>
              <div class="field">
                <label for="customRingStoneSize">Stone size</label>
                <div class="field-input field-input--range">
                  <input class="config-hidden" id="customRingStoneSize" type="hidden" data-config-param="stone_size" value="" />
                  <div class="range-readout"><span>Selected size</span><strong data-size-output="customRingStoneSize">0.3 ct</strong></div>
                  <input class="stone-size-range" type="range" min="0.3" max="8" step="0.1" value="0.3" data-size-range="customRingStoneSize" aria-label="Stone size slider" />
                  <div class="range-scale"><span>0.3 ct</span><span>8.0 ct+</span></div>
                </div>
              </div>
              <div class="field field--wide">
                <label for="customRingColour">Colour</label>
                <div class="field-input">
                  <input class="config-hidden" id="customRingColour" type="hidden" data-config-param="colour" value="" />
                  <input class="config-hidden" id="customRingColourType" type="hidden" value="Lab diamond" />
                  <div class="option-slider" data-option-slider="customRingColourType" aria-label="Stone type">
                    <button class="option-pill option-pill--clear" type="button" data-option-value="Lab diamond">Lab diamond</button>
                    <button class="option-pill option-pill--sapphire" type="button" data-option-value="Lab gemstone">Lab gemstone</button>
                  </div>
                  <div class="gemstone-options" data-gemstone-options hidden>
                    <div class="option-slider" data-option-slider="customRingColour" aria-label="Gemstone colour">
                      <button class="option-pill option-pill--ruby" type="button" data-option-value="Ruby">Ruby</button>
                      <button class="option-pill option-pill--sapphire" type="button" data-option-value="Sapphire">Sapphire</button>
                      <button class="option-pill option-pill--aquamarine" type="button" data-option-value="Aquamarine">Aquamarine</button>
                      <button class="option-pill option-pill--alexandrite" type="button" data-option-value="Alexandrite">Alexandrite</button>
                      <button class="option-pill option-pill--morganite" type="button" data-option-value="Morganite">Morganite</button>
                    </div>
                  </div>
                </div>
              </div>
              <div class="field">
                <label for="customRingClarity">Clarity</label>
                <div class="field-input field-input--range">
                  <input class="config-hidden" id="customRingClarity" type="hidden" data-config-param="clarity" value="" />
                  <div class="range-readout"><span>Selected clarity</span><strong data-discrete-output="customRingClarity">Flawless</strong></div>
                  <input class="stone-size-range" type="range" min="0" max="7" step="1" value="0" data-discrete-range="customRingClarity" data-range-values="Flawless|Internally Flawless|VVS1|VVS2|VS1|VS2|SI1|Not sure" aria-label="Clarity slider" />
                  <div class="range-scale"><span>Flawless</span><span>Not sure</span></div>
                </div>
              </div>
            </div>

            <div class="selection-summary">
              <strong>Total:</strong> £1999
            </div>

            <div class="actions">
              <a class="btn btn-primary" href="ring-form.html" data-config-link>Create your own</a>
            </div>
          </div>
        </article>
      </section>
    </div>
  </main>

  <script src="ring-showcase.js"></script>
</body>
</html>
