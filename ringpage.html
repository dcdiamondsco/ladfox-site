  <style>
      :root{
        --text:#f5f5f5;
        --muted:#cfcfcf;
        --card:#0b0b0b;
        --line:#2a2a2a;
        --shadow:0 12px 34px rgba(0,0,0,.32);
        --radius:18px;

        --h-font:"Plus Jakarta Sans", sans-serif;
        --body-font:"Manrope", system-ui, sans-serif;
        --ui-font:"Manrope", system-ui, sans-serif;
      }

      *{ box-sizing:border-box; }

      .visually-hidden{
        position:absolute !important;
        width:1px !important;
        height:1px !important;
        padding:0 !important;
        margin:-1px !important;
        overflow:hidden !important;
        clip:rect(0,0,0,0) !important;
        white-space:nowrap !important;
        border:0 !important;
      }

      :focus-visible{
        outline:2px solid #f1e0b4;
        outline-offset:3px;
      }

      html{
        scroll-behavior:smooth;
        scroll-padding-bottom:110px;
        background:#000;
        width:100%;
        overflow-x:hidden;
        -webkit-text-size-adjust:100%;
      }

      body{
        overscroll-behavior-y:auto;
        -webkit-overflow-scrolling:touch;
        margin:0;
        width:100%;
        min-height:100svh;
        background:#000;
        color:var(--text);
        font-family:var(--body-font);
        line-height:1.45;
        overflow-x:hidden;
        overflow-y:auto;
        padding-top:env(safe-area-inset-top, 0);
        padding-bottom:env(safe-area-inset-bottom, 0);
      }

      .topbar{
        padding:18px 0 10px;
        position:relative;
        z-index:2;
      }

      .topbar__inner{
        display:flex;
        align-items:flex-start;
        justify-content:space-between;
        gap:16px;
        flex-wrap:wrap;
        position:relative;
        padding-right:170px;
      }

      .brand{
        display:inline-flex;
        align-items:center;
        justify-content:center;
        line-height:0;
      }

      .brand-lockup{
        display:flex;
        align-items:center;
        justify-content:flex-start;
        gap:12px;
        flex-wrap:wrap;
      }

      .brand-logo{
        width:min(205px, 44vw);
        height:auto;
        display:block;
      }

      .brand-review-link{
        display:flex;
        align-items:center;
        justify-content:center;
        position:absolute;
        top:0;
        right:0;
      }

      .brand-review-badge{
        width:138px;
        height:auto;
        display:block;
      }

      @media(max-width:720px){
        .section[aria-label="Why choose LADFOX"]{ display:none; }
        #start > .copy > h2,
        #start > .copy > .micro,
        #start > .copy > .form-intro{ display:none; }
        #start > .copy{
          padding:0;
          background:transparent;
          border:0;
          box-shadow:none;
          gap:0;
        }
        #start > .copy::before,
        #start > .copy::after{ display:none; }
      }

      .wrap{
        width:100%;
        margin:0 auto;
        padding:0;
      }

      .intro-visual{
        width:100vw;
        margin:0;
        margin-left:calc(50% - 50vw);
        margin-right:calc(50% - 50vw);
        padding:0;
        border:0;
        border-radius:0;
        background:transparent;
        box-shadow:none;
        overflow:hidden;
        position:relative;
      }

      .intro-visual img{
        width:100%;
        height:min(66vw, 560px);
        object-fit:cover;
        object-position:center center;
        display:block;
      }

      .intro-visual::before{
        content:"";
        position:absolute;
        left:0;
        right:0;
        top:0;
        height:120px;
        background:linear-gradient(180deg, #000 0%, rgba(0,0,0,.7) 46%, rgba(0,0,0,0) 100%);
        pointer-events:none;
        z-index:1;
      }

      .intro-visual::after{
        content:"";
        position:absolute;
        left:0;
        right:0;
        bottom:0;
        height:28%;
        background:linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,.56) 52%, #000 100%);
        pointer-events:none;
        z-index:1;
      }

      .hero-intro{
        max-width:920px;
        margin:30px auto 18px;
        text-align:center;
        padding:0 8px;
      }

      .hero-intro .kicker{
        justify-content:center;
      }

      .grid-2{
        display:grid;
        grid-template-columns:1.12fr .88fr;
        gap:18px;
        align-items:stretch;
      }

      #start{
        scroll-margin-top:120px;
      }

      @media(max-width:1000px){
        .grid-2{ grid-template-columns:1fr; }
      }

      .copy,
      .card{
        background:transparent;
        border:0;
        border-radius:0;
        box-shadow:none;
      }

      .copy{
        padding:clamp(18px,2.4vw,26px);
        text-align:center;
        display:flex;
        flex-direction:column;
        gap:14px;
        justify-content:center;
        position:relative;
        overflow:hidden;
      }

      .copy::before{
        content:"";
        position:absolute;
        inset:auto -30% -40% auto;
        width:260px;
        height:260px;
        border-radius:999px;
        background:radial-gradient(circle at 30% 30%, rgba(0,0,0,.12), rgba(0,0,0,0) 70%);
        pointer-events:none;
      }

      .copy::after{
        content:"";
        position:absolute;
        inset:12px auto auto 16px;
        width:140px;
        height:140px;
        border-radius:999px;
        border:1px solid rgba(0,0,0,.18);
        box-shadow:0 0 0 10px rgba(0,0,0,.06);
        pointer-events:none;
      }

      .kicker{
        margin:0;
        display:inline-flex;
        font-family:var(--ui-font);
        text-transform:uppercase;
        letter-spacing:.3em;
        font-size:.68rem;
        color:#fff;
      }

      h1{
        font-family:var(--h-font);
        font-size:clamp(28px,3.4vw,44px);
        margin:0;
        font-weight:700;
        letter-spacing:.2px;
      }

      h2{
        font-family:var(--h-font);
        font-size:clamp(20px,2.1vw,28px);
        margin:0;
        letter-spacing:.2px;
      }

      .sub{
        margin:0;
        font-size:1.12rem;
        font-weight:600;
        color:var(--muted);
      }

      .micro{
        margin:6px 0 0;
        font-family:var(--ui-font);
        font-size:.88rem;
        color:#bdbdbd;
        line-height:1.45;
      }

      .proof{
        margin:14px auto 0;
        max-width:820px;
        display:flex;
        flex-wrap:wrap;
        gap:8px;
        justify-content:center;
      }

      .pill{
        border:1px solid var(--line);
        border-radius:999px;
        padding:8px 12px;
        font-family:var(--ui-font);
        font-size:.82rem;
        font-weight:700;
        background:#0f0f0f;
      }

      .cta-row{
        margin-top:16px;
        display:flex;
        gap:10px;
        justify-content:center;
        flex-wrap:wrap;
      }

      .btn{
        display:inline-flex;
        align-items:center;
        justify-content:center;
        gap:10px;
        padding:13px 20px;
        background:linear-gradient(145deg, #f1e0b4, #cfa75b);
        color:#fff;
        border-radius:18px;
        text-decoration:none;
        font-family:var(--ui-font);
        font-size:.94rem;
        letter-spacing:.08em;
        text-transform:uppercase;
        font-weight:700;
        border:1px solid rgba(255,255,255,.14);
        min-width:220px;
        box-shadow:0 14px 30px rgba(95,67,17,.28);
        transition:transform .18s ease, box-shadow .18s ease, filter .18s ease;
        cursor:pointer;
      }

      .secondary-form-link{
        margin:4px auto 0;
        width:fit-content;
        color:rgba(255,255,255,.82);
        font-family:var(--ui-font);
        font-size:.88rem;
        line-height:1.5;
        text-decoration:underline;
        text-underline-offset:4px;
      }

      .secondary-form-link:hover,
      .secondary-form-link:focus-visible{
        color:#fff;
        outline:none;
      }

      .btn--secondary{
        background:#000;
        color:#fff;
        border:1px solid #000;
        box-shadow:none;
      }

      .btn:hover{
        transform:translateY(-1px);
        box-shadow:0 18px 34px rgba(95,67,17,.34);
        filter:brightness(1.03);
      }

      .quick-start-status{
        min-height:1.25em;
        margin:10px 0 0;
        font-family:var(--ui-font);
        font-size:.9rem;
        color:#ffb3b3;
      }

      .guided-form{
        --metal-shell-bg:linear-gradient(180deg, rgba(8,8,8,.68), rgba(16,16,16,.54));
        --metal-shell-border:rgba(255,255,255,.1);
        --metal-shell-shadow:rgba(0,0,0,.2);
        --metal-panel-bg:rgba(255,255,255,.02);
        --metal-panel-border:transparent;
        --metal-choice-bg:rgba(255,255,255,.025);
        --metal-choice-border:rgba(255,255,255,.14);
        --metal-choice-hover-bg:rgba(255,255,255,.05);
        --metal-choice-hover-border:rgba(255,255,255,.3);
        --metal-input-bg:rgba(18,18,18,.58);
        --metal-input-border:rgba(255,255,255,.18);
        --metal-input-focus-border:rgba(255,255,255,.34);
        --metal-input-shadow:inset 0 0 0 1px rgba(255,255,255,.04);
        --metal-accent-text:#fff;
        --metal-cta-bg:linear-gradient(145deg, #f1e0b4, #cfa75b);
        --metal-cta-border:rgba(255,255,255,.14);
        --metal-cta-shadow:rgba(95,67,17,.28);
        --metal-cta-text:#1d1407;
        --ring-overlay-left:0;
        --ring-overlay-right:0;
        --ring-overlay-top:clamp(168px, 31svh, 244px);
        --ring-overlay-height:clamp(388px, 55svh, 520px);
        --ring-overlay-position:50% 100%;
        --ring-overlay-size:70% auto;
        --ring-setting-overlay-position:var(--ring-overlay-position);
        --ring-setting-overlay-size:var(--ring-overlay-size);
        --ring-setting-overlay-clip:inset(0 30% 58% 30%);
        --ring-overlay-color:#f6dfae;
        --ring-overlay-opacity:.52;
        --ring-selected-stone-image:url("./Images/Ringpage Form Background Images/1 Plain ring.png");
        --ring-pave-overlay-opacity:calc(var(--ring-overlay-opacity) * .82);
        --ring-half-pave-overlay-opacity:calc(var(--ring-overlay-opacity) * .78);
        --ring-setting-overlay-opacity:1;
        --ring-combined-overlay-opacity:.28;
        --ring-setting-pave-overlay-opacity:.2;
        --ring-half-pave-position:50% 92%;
        --ring-overlay-filter:brightness(0) saturate(100%) invert(88%) sepia(7%) saturate(202%) hue-rotate(179deg) brightness(101%) contrast(94%);
        --ring-image-filter-adjust:brightness(1.12) contrast(1);
        display:grid;
        grid-template-rows:auto minmax(0, 1fr) auto auto;
        gap:8px;
        width:min(640px, 100%);
        margin:0 auto;
        min-height:calc(100svh - 48px);
        padding:16px 0 18px;
        border:0;
        border-radius:0;
        background:transparent;
        box-shadow:none;
        position:relative;
        isolation:isolate;
        transition:background .2s ease, border-color .2s ease, box-shadow .2s ease;
        align-content:start;
      }

      .guided-form::before{
        content:"";
        position:absolute;
        left:var(--ring-overlay-left);
        right:var(--ring-overlay-right);
        top:var(--ring-overlay-top);
        height:var(--ring-overlay-height);
        z-index:0;
        background-image:url("./Images/Ringpage Form Background Images/1 Plain ring.png");
        background-position:var(--ring-overlay-position);
        background-size:var(--ring-overlay-size);
        background-repeat:no-repeat;
        opacity:var(--ring-overlay-opacity);
        filter:var(--ring-overlay-filter) var(--ring-image-filter-adjust);
        pointer-events:none;
        transition:opacity .08s linear;
      }

      .guided-form::after{
        content:"";
        position:absolute;
        left:var(--ring-overlay-left);
        right:var(--ring-overlay-right);
        top:var(--ring-overlay-top);
        height:var(--ring-overlay-height);
        z-index:1;
        background-image:url("./Images/Ringpage Form Background Images/pave.png");
        background-position:var(--ring-overlay-position);
        background-size:var(--ring-overlay-size);
        background-repeat:no-repeat;
        opacity:0;
        filter:var(--ring-overlay-filter) var(--ring-image-filter-adjust);
        pointer-events:none;
        transition:opacity .08s linear;
      }

      .guided-form--cathedral-overlay::before{
        background-image:url("./Images/Ringpage Form Background Images/2 Solitaire no stone.png");
        opacity:var(--ring-overlay-opacity);
      }

      .guided-form--halo-image::before{
        background-image:url("./Images/Ringpage Form Background Images/2 Solitaire no stone.png");
        opacity:var(--ring-overlay-opacity);
      }

      .guided-form--solitaire-round-image::before{
        background-image:url("./Images/Ringpage Form Background Images/3 Solitaire round.png");
        --ring-selected-stone-image:url("./Images/Ringpage Form Background Images/3 Solitaire round.png");
      }

      .guided-form--solitaire-round-plain-image::before{
        background-image:url("./Images/Ringpage Form Background Images/4 Solitaire round plain.png");
        --ring-selected-stone-image:url("./Images/Ringpage Form Background Images/4 Solitaire round plain.png");
      }

      .guided-form--solitaire-oval-image::before{
        background-image:url("./Images/Ringpage Form Background Images/3 Solitaire oval.png");
        --ring-selected-stone-image:url("./Images/Ringpage Form Background Images/3 Solitaire oval.png");
      }

      .guided-form--solitaire-emerald-image::before{
        background-image:url("./Images/Ringpage Form Background Images/3 Solitaire Emerald.png");
        --ring-selected-stone-image:url("./Images/Ringpage Form Background Images/3 Solitaire Emerald.png");
      }

      .guided-form--solitaire-radiant-image::before{
        background-image:url("./Images/Ringpage Form Background Images/3 Solitaire radient.png");
        --ring-selected-stone-image:url("./Images/Ringpage Form Background Images/3 Solitaire radient.png");
      }

      .guided-form--solitaire-princess-image::before{
        background-image:url("./Images/Ringpage Form Background Images/3 Solitaire princess.png");
        --ring-selected-stone-image:url("./Images/Ringpage Form Background Images/3 Solitaire princess.png");
      }

      .guided-form--solitaire-cushion-image::before{
        background-image:url("./Images/Ringpage Form Background Images/3 Solitaire cushion.png");
        --ring-selected-stone-image:url("./Images/Ringpage Form Background Images/3 Solitaire cushion.png");
      }

      .guided-form--solitaire-pear-image::before{
        background-image:url("./Images/Ringpage Form Background Images/3 Solitaire pear.png");
        --ring-selected-stone-image:url("./Images/Ringpage Form Background Images/3 Solitaire pear.png");
      }

      .guided-form--solitaire-marquise-image::before{
        background-image:url("./Images/Ringpage Form Background Images/3 Solitaire Marquise.png");
        --ring-selected-stone-image:url("./Images/Ringpage Form Background Images/3 Solitaire Marquise.png");
      }

      .guided-form--trilogy-image::before{
        background-image:url("./Images/Ringpage Form Background Images/4 Trilogy.png");
      }

      .guided-form--trilogy-large-centre-image::before{
        background-image:url("./Images/Ringpage Form Background Images/4 Trilogy.png");
      }

      .guided-form--toi-et-moi-image::before{
        background-image:url("./Images/Ringpage Form Background Images/Toi et moi.png");
      }

      .guided-form--cluster-image::before{
        background-image:url("./Images/Ringpage Form Background Images/cluster.png");
        --ring-selected-stone-image:url("./Images/Ringpage Form Background Images/cluster.png");
      }

      .guided-form--tulip-image::before{
        background-image:url("./Images/Ringpage Form Background Images/tulip.png");
        background-position:var(--ring-overlay-position);
        background-size:var(--ring-overlay-size);
        background-repeat:no-repeat;
        opacity:var(--ring-overlay-opacity);
        filter:var(--ring-overlay-filter) var(--ring-image-filter-adjust);
      }

      .guided-form--tulip-image::after{
        background-image:none;
        opacity:0;
        filter:var(--ring-overlay-filter) var(--ring-image-filter-adjust);
        -webkit-mask-image:none;
        mask-image:none;
        clip-path:none;
      }

      .guided-form--classic-image::before{
        background-image:url("./Images/Ringpage Form Background Images/classic.png");
        background-position:var(--ring-overlay-position);
        background-size:var(--ring-overlay-size);
        background-repeat:no-repeat;
        opacity:var(--ring-overlay-opacity);
        filter:var(--ring-overlay-filter) var(--ring-image-filter-adjust);
      }

      .guided-form--classic-image::after{
        background-color:transparent;
        background-image:none;
        opacity:0;
        filter:var(--ring-overlay-filter) var(--ring-image-filter-adjust);
        -webkit-mask-image:none;
        mask-image:none;
        clip-path:none;

      .guided-form--tulip-setting-zoom.guided-form--tulip-image::before{
        background-image:url("./Images/Ringpage Form Background Images/zoomed in petal.png");

      .guided-form--classic-setting-zoom.guided-form--classic-image::before{
        background-image:url("./Images/Ringpage Form Background Images/zoomed in no stone.png");

      .guided-form--halo-overlay::after{

        background-image:
          url("./Images/Ringpage Form Background Images/halo.png"),

        background-position:var(--ring-overlay-position), var(--ring-overlay-position);
        background-size:var(--ring-overlay-size), var(--ring-overlay-size);
        background-repeat:no-repeat, no-repeat;
        opacity:var(--ring-overlay-opacity);
      }

      .guided-form--tulip-image.guided-form--pave-overlay::after{
        background-image:url("./Images/Ringpage Form Background Images/pave.png");
        background-position:var(--ring-overlay-position);
        background-size:var(--ring-overlay-size);
        background-repeat:no-repeat;
        opacity:var(--ring-pave-overlay-opacity);

      function mergeQueryParamsIntoLink(href, currentParams){
        try{
          const url = new URL(href, window.location.origin);
          const linkParams = new URLSearchParams(url.search);
          currentParams.forEach((value, key) => {
            if (!linkParams.has(key)) linkParams.set(key, value);
          });
          url.search = linkParams.toString() ? "?" + linkParams.toString() : "";
          return url.pathname + url.search + url.hash;
        }catch(e){
          return href;
        }
      }

          utm_campaign: "quickStartUtmCampaign",
          utm_term: "quickStartUtmTerm",
          utm_content: "quickStartUtmContent",
          gclid: "quickStartGclid"
        };

        Object.entries(attributionFields).forEach(([param, id]) => {
          const field = document.getElementById(id);
          if (field) field.value = currentParams.get(param) || "";
        });

        const landingPage = document.getElementById("quickStartLandingPage");
        const referrer = document.getElementById("quickStartReferrer");
        if (landingPage) landingPage.value = window.location.href;
        if (referrer) referrer.value = document.referrer || "Direct";

        if ([...currentParams.keys()].length === 0) return;
        document.querySelectorAll("a[href]").forEach((anchor) => {
          const href = anchor.getAttribute("href");
          if (!href || /^(?:https?:|mailto:|tel:|#)/i.test(href)) return;
          anchor.setAttribute("href", mergeQueryParamsIntoLink(href, currentParams));
        });

        }
        for (let plus = 1; plus <= 6; plus += 1) {

          const files = getReferenceFiles();

          return files.length === 0
            ? ""
            : `${files.length} image${files.length === 1 ? "" : "s"} attached · ${(totalBytes / 1024 / 1024).toFixed(1)} MB total`;

        function renderReferenceImageUpload(parentEl, primaryLabel = "Attach an image"){

            uploadMeta.textContent = files.length === 0
              ? ""
              : `${files.length} image${files.length === 1 ? "" : "s"} attached · ${(totalBytes / 1024 / 1024).toFixed(1)} MB total`;

          return new Intl.NumberFormat(currency.locale, {

            currency: currency.code,
            maximumFractionDigits: 0
          }).format(numericValue);

        function buildSelectionSummary(){
          const items = [];
          const styleDetailEditKey = formValues.multi_stone_style === "Halo"
            ? "halo_variant"
            : formValues.multi_stone_style === "Trilogy"
              ? "trilogy_style_detail"
              : "setting_design";
          const stoneSizeEditKey = formValues.multi_stone_style === "Toi et Moi"
            ? "toi_et_moi_sizes"
            : formValues.multi_stone_style === "Trilogy"
              ? "trilogy_centre_size"
              : formValues.multi_stone_style === "Halo"
                ? "halo_centre_size"
                : "stone_size";
          const pushItem = (label, value, editStepKey) => {
            const cleaned = String(value || "").trim();
            if (!cleaned) return;
            items.push({ label, value: cleaned, editStepKey });
          };

          pushItem("Metal", formValues.ring_metal, "ring_metal");
          pushItem("Style", formValues.multi_stone_style, "multi_stone_style");

          if (formValues.multi_stone_style === "Toi et Moi") {
            pushItem("Stone shapes", [
              formValues.toi_et_moi_first_shape ? `Stone 1: ${formValues.toi_et_moi_first_shape}` : "",
              formValues.toi_et_moi_second_shape ? `Stone 2: ${formValues.toi_et_moi_second_shape}` : ""
            ].filter(Boolean).join(" | "), "toi_et_moi_first_shape");
            pushItem("Stone types", [
              formValues.toi_et_moi_first_stone_type ? `Stone 1: ${formValues.toi_et_moi_first_stone_type}${formValues.toi_et_moi_first_gemstone ? ` (${formValues.toi_et_moi_first_gemstone})` : ""}` : "",
              formValues.toi_et_moi_second_stone_type ? `Stone 2: ${formValues.toi_et_moi_second_stone_type}${formValues.toi_et_moi_second_gemstone ? ` (${formValues.toi_et_moi_second_gemstone})` : ""}` : ""
            ].filter(Boolean).join(" | "), "toi_et_moi_first_stone_type");
          } else if (formValues.multi_stone_style === "Trilogy") {
            pushItem("Stone shapes", [formValues.trilogy_centre_shape, formValues.trilogy_side_shape].filter(Boolean).join(" / "), "trilogy_centre_shape");
            pushItem("Stone type", formValues.stone_type, "stone_type");
            pushItem("Natural gemstone", formValues.gemstone_type, "gemstone_type");
          } else {
            pushItem("Stone shape", formValues.stone_shape, formValues.multi_stone_style === "Halo" ? "halo_style_detail" : "stone_shape");
            pushItem("Stone type", formValues.stone_type, "stone_type");
            pushItem("Natural gemstone", formValues.gemstone_type, "gemstone_type");
          }

          pushItem("Style detail", formValues.style_detail, styleDetailEditKey);
          pushItem("Stone size", formValues.stone_size, stoneSizeEditKey);
          pushItem("Ring size", formValues.ring_size, "ring_size");
          pushItem("Pavé band", formValues.pave_band, "pave_band");
          pushItem("Pavé coverage", formValues.pave_coverage, "pave_coverage");
          pushItem("Setting design", formValues.setting_design, "setting_design");
          pushItem("Budget", formValues.budget ? formatBudgetValue(formValues.budget) : "", "budget");
          pushItem("Notes", buildCombinedOtherNotes(), "other_notes");

        function shouldShowStep(step){
          if (!step) return false;
          if (step.key === "design_request_type") return false;
          if (isImageSubmissionStyle(formValues.multi_stone_style)) {
            return ["ring_metal", "multi_stone_style", "other_notes", "email_capture"].includes(step.key);
          }
          if (isOtherDetailStep(step)) {
            const sourceValue = String(formValues[step.otherDetailSourceKey] || "");
            return sourceValue.split(",").map((item) => item.trim()).includes("Other");
          }
          if (step.key === "toi_et_moi_first_shape") return formValues.multi_stone_style === "Toi et Moi";
          if (step.key === "toi_et_moi_second_shape") return formValues.multi_stone_style === "Toi et Moi";
          if (step.key === "toi_et_moi_sizes") return formValues.multi_stone_style === "Toi et Moi";
          if (step.key === "trilogy_style_detail") return formValues.multi_stone_style === "Trilogy";
          if (step.key === "trilogy_centre_shape") return formValues.multi_stone_style === "Trilogy";
          if (step.key === "trilogy_side_shape") return formValues.multi_stone_style === "Trilogy";
          if (step.key === "trilogy_centre_size") return formValues.multi_stone_style === "Trilogy";
          if (step.key === "toi_et_moi_first_stone_type") return formValues.multi_stone_style === "Toi et Moi";
          if (step.key === "toi_et_moi_first_gemstone") return formValues.multi_stone_style === "Toi et Moi" && ["Natural gemstone", "Lab gemstone"].includes(formValues.toi_et_moi_first_stone_type);
          if (step.key === "toi_et_moi_second_stone_type") return formValues.multi_stone_style === "Toi et Moi";
          if (step.key === "toi_et_moi_second_gemstone") return formValues.multi_stone_style === "Toi et Moi" && ["Natural gemstone", "Lab gemstone"].includes(formValues.toi_et_moi_second_stone_type);
          if (step.key === "toi_et_moi_gemstones") return false;
          if (step.key === "halo_variant") return formValues.multi_stone_style === "Halo";
          if (step.key === "halo_style_detail") return formValues.multi_stone_style === "Halo";
          if (step.key === "halo_centre_size") return formValues.multi_stone_style === "Halo";
          if (step.key === "stone_type") return formValues.multi_stone_style !== "Toi et Moi";

          if (step.key === "stone_size") return !["Toi et Moi", "Trilogy", "Halo"].includes(formValues.multi_stone_style);
          if (step.key === "pave_coverage") return formValues.pave_band === "Yes";
          if (step.key === "setting_design") return !["cluster", "toi et moi", "trilogy", "bezel"].includes(normalizeChoiceValue(formValues.multi_stone_style));
          return true;

          return ["halo_variant", "halo_style_detail", "halo_centre_size", "pave_band", "pave_coverage", "setting_design", "stone_type", "gemstone_type", "other_notes", "email_capture"].includes(step.key);
        }

        function shouldShowToiEtMoiImage(step){
          if (!step) return false;
          if (formValues.multi_stone_style !== "Toi et Moi") return false;
          return ["toi_et_moi_first_shape", "toi_et_moi_second_shape", "toi_et_moi_sizes", "ring_size", "toi_et_moi_first_stone_type", "toi_et_moi_first_gemstone", "toi_et_moi_second_stone_type", "toi_et_moi_second_gemstone", "pave_band", "pave_coverage", "other_notes", "email_capture"].includes(step.key);
        }

        function shouldShowClusterImage(step){
          if (!step) return false;
          if (formValues.multi_stone_style !== "Cluster") return false;
          return ["stone_size", "ring_size", "pave_band", "pave_coverage", "stone_type", "gemstone_type", "other_notes", "email_capture"].includes(step.key);
        }

        function getRingImageState(step){
          if (step && step.key === "multi_stone_style") return "plain";
          if (
            isUnsureChoiceValue(formValues.multi_stone_style) ||
            isUnsureChoiceValue(formValues.stone_shape) ||
            isUnsureChoiceValue(formValues.halo_style_detail) ||
            isUnsureChoiceValue(formValues.trilogy_style_detail) ||
            isUnsureChoiceValue(formValues.setting_design) ||
            isUnsureChoiceValue(formValues.pave_band) ||
            isUnsureChoiceValue(formValues.pave_coverage)
          ) {
            return "solitaire-round";
          }
          if (formValues.multi_stone_style === "Halo" && formValues.stone_shape === "Emerald") return "solitaire-emerald";
          if (formValues.multi_stone_style === "Halo" && formValues.stone_shape === "Oval") return "solitaire-oval";
          if (formValues.multi_stone_style === "Halo" && formValues.stone_shape === "Radiant") return "solitaire-radiant";
          if (formValues.multi_stone_style === "Halo" && formValues.stone_shape === "Princess") return "solitaire-princess";
          if (formValues.multi_stone_style === "Halo" && formValues.stone_shape === "Cushion") return "solitaire-cushion";
          if (formValues.multi_stone_style === "Halo" && formValues.stone_shape === "Pear") return "solitaire-pear";
          if (formValues.multi_stone_style === "Halo" && formValues.stone_shape === "Marquise") return "solitaire-marquise";
          if (formValues.multi_stone_style === "Halo" && formValues.stone_shape === "Round") return "solitaire-round";
          if (formValues.multi_stone_style === "Solitaire" && formValues.stone_shape === "Emerald") return "solitaire-emerald";
          if (formValues.multi_stone_style === "Solitaire" && formValues.stone_shape === "Oval") return "solitaire-oval";
          if (formValues.multi_stone_style === "Solitaire" && formValues.stone_shape === "Radiant") return "solitaire-radiant";
          if (formValues.multi_stone_style === "Solitaire" && formValues.stone_shape === "Princess") return "solitaire-princess";
          if (formValues.multi_stone_style === "Solitaire" && formValues.stone_shape === "Cushion") return "solitaire-cushion";
          if (formValues.multi_stone_style === "Solitaire" && formValues.stone_shape === "Pear") return "solitaire-pear";
          if (formValues.multi_stone_style === "Solitaire" && formValues.stone_shape === "Marquise") return "solitaire-marquise";
          if (formValues.multi_stone_style === "Solitaire" && formValues.stone_shape === "Round") return "solitaire-round";
          if (shouldShowSolitaireRoundImage(step)) return "solitaire-round";
          if (shouldShowSolitaireRoundPlainImage(step)) return "solitaire-round-plain";
          if (shouldShowSolitaireOvalImage(step)) return "solitaire-oval";
          if (shouldShowSolitaireEmeraldImage(step)) return "solitaire-emerald";
          if (shouldShowSolitaireRadiantImage(step)) return "solitaire-radiant";
          if (shouldShowSolitairePrincessImage(step)) return "solitaire-princess";
          if (shouldShowSolitaireCushionImage(step)) return "solitaire-cushion";
          if (shouldShowSolitairePearImage(step)) return "solitaire-pear";
          if (shouldShowSolitaireMarquiseImage(step)) return "solitaire-marquise";
          if (shouldShowHaloImage(step)) return "halo";
          if (shouldShowCathedralOverlay(step)) return "cathedral";
          if (shouldShowToiEtMoiImage(step)) return "toi-et-moi";
          if (shouldShowClusterImage(step)) return "cluster";
          if (shouldShowTrilogyLargeCentreImage(step)) return "trilogy-large-centre";
          if (shouldShowTrilogyImage(step)) return "trilogy";
          return "plain";
        }

        function resolveDisplayedRingImage(step){
          const nextRingImage = getRingImageState(step);
          if (
            formValues.multi_stone_style === "Cluster" &&
            [
              "stone_size",
              "ring_size",
              "pave_band",
              "pave_coverage",
              "stone_type",
              "gemstone_type",
              "other_notes",
              "email_capture"
            ].includes(step?.key)
          ) {
            return "cluster";
          }
          if (["pave_coverage", "setting_design"].includes(step?.key) && activeRingImage !== "plain") {
            return activeRingImage;
          }
          if (step?.key === "pave_band" && nextRingImage === "plain" && activeRingImage !== "plain") {
            return activeRingImage;
          }
          return nextRingImage;
        }

        function getMobilePreviewImage(step, nextRingImage){
          const imageBase = getRingImageAssetUrl;
          if (step?.key === "setting_design") return getSettingDesignImageUrl(formValues.setting_design || "Classic");
          if (formValues.multi_stone_style === "Bezel") return imageBase("bezel.png");

          const imageMap = {
            "plain": imageBase("1 Plain ring.png"),
            "cathedral": imageBase("2 Solitaire no stone.png"),
            "halo": imageBase("2 Solitaire no stone.png"),
            "solitaire-round": imageBase("3 Solitaire round.png"),
            "solitaire-round-plain": imageBase("4 Solitaire round plain.png"),
            "solitaire-oval": imageBase("3 Solitaire oval.png"),
            "solitaire-emerald": imageBase("3 Solitaire Emerald.png"),
            "solitaire-radiant": imageBase("3 Solitaire radient.png"),
            "solitaire-princess": imageBase("3 Solitaire princess.png"),
            "solitaire-cushion": imageBase("3 Solitaire cushion.png"),
            "solitaire-pear": imageBase("3 Solitaire pear.png"),
            "solitaire-marquise": imageBase("3 Solitaire Marquise.png"),
            "trilogy": imageBase("4 Trilogy.png"),
            "trilogy-large-centre": imageBase("4 Trilogy.png"),
            "toi-et-moi": imageBase("Toi et moi.png"),
            "cluster": imageBase("cluster.png")
          };

          return imageMap[nextRingImage] || imageMap.plain;
        }

        function getMobilePreviewOverlayImages(step){
          if (step?.key === "setting_design") return "none";
          const imageBase = getRingImageAssetUrl;
          const overlays = [];

          if (formValues.style_detail === "Hidden halo") {
            overlays.push(`url("${imageBase("hidden halo.png")}")`);
          } else if (formValues.style_detail === "Regular halo") {
            overlays.push(`url("${imageBase("halo.png")}")`);
          }

          if (formValues.pave_band === "Yes") {
            overlays.push(
              formValues.pave_coverage === "Half pavé"
                ? `url("${imageBase("half pave.png")}")`
                : `url("${imageBase("pave.png")}")`
            );
          }

          return overlays.join(", ") || "none";
        }

        function clearMobilePreview(){
          if (!previewEl) return;
          previewEl.hidden = true;
          previewEl.style.removeProperty("--mobile-preview-image");
          previewEl.style.removeProperty("--mobile-preview-overlay-image");
          previewEl.style.removeProperty("--mobile-preview-overlay-position");
          previewEl.style.removeProperty("--mobile-preview-overlay-size");
          previewEl.style.removeProperty("--mobile-preview-overlay-opacity");
        }

        function renderMobilePreview(step, nextRingImage){
          if (!previewEl) return;
          if (!step || introActive || summaryScreenActive) {
            clearMobilePreview();
            return;
          }

          if (step.key === "ring_metal") {
            clearMobilePreview();
            return;
          }

          const previewImage = getMobilePreviewImage(step, nextRingImage);
          if (!previewImage) {
            clearMobilePreview();
            return;
          }

          previewEl.hidden = false;
          previewEl.style.setProperty("--mobile-preview-image", `url("${previewImage}")`);
          const overlayImages = getMobilePreviewOverlayImages(step);
          previewEl.style.setProperty("--mobile-preview-overlay-image", overlayImages);

          if (step.key === "setting_design") {
            previewEl.style.setProperty("--mobile-preview-image-position", "center 34%");
            previewEl.style.setProperty("--mobile-preview-image-size", "auto 80%");
          } else {
            previewEl.style.removeProperty("--mobile-preview-image-position");
            previewEl.style.removeProperty("--mobile-preview-image-size");
          }

          const overlayCount = overlayImages === "none"
            ? 0
            : overlayImages.split(", url(").length;
          const fixedOverlayPositions = Array(overlayCount).fill("center 62%");
          const fixedOverlaySizes = Array(overlayCount).fill("auto 132%");

          previewEl.style.setProperty(
            "--mobile-preview-overlay-position",
            fixedOverlayPositions.join(", ") || "center 62%"
          );
          previewEl.style.setProperty(
            "--mobile-preview-overlay-size",
            fixedOverlaySizes.join(", ") || "auto 132%"
          );
          previewEl.style.setProperty("--mobile-preview-overlay-opacity", "1");
        }

        function shouldShowSettingDesignImage(){
          return ["Solitaire", "Cluster", "Halo"].includes(formValues.multi_stone_style);
        }

        function triggerRingImageTransform(nextImage, forceReplay = false){
          if (!shellEl) return;
          if (!forceReplay && nextImage === activeRingImage) return;
          activeRingImage = nextImage;
          shellEl.classList.remove("guided-form--image-transforming");
          if (imageTransformTimer) window.clearTimeout(imageTransformTimer);
          void shellEl.offsetWidth;
          shellEl.classList.add("guided-form--image-transforming");
          imageTransformTimer = window.setTimeout(() => {
            shellEl.classList.remove("guided-form--image-transforming");
          }, 90);
        }

        function moveToNextStep(){
          do {
            stepIndex += 1;
          } while (stepIndex < steps.length && !shouldShowStep(steps[stepIndex]));
        }

        function moveToPreviousStep(){
          do {
            stepIndex -= 1;
          } while (stepIndex >= 0 && !shouldShowStep(steps[stepIndex]));
        }

        function getStepValue(step){
          if (isOtherDetailStep(step)) {
            return otherDetailValues[step.otherDetailSourceKey] || "";
          }
          return formValues[step.storeKey || step.key];
        }

        function setStepValue(step, value){
          if (isOtherDetailStep(step)) {
            otherDetailValues[step.otherDetailSourceKey] = value;
            return;
          }
          formValues[step.storeKey || step.key] = value;
        }

        function getStepLabel(step){
          if (!step) return "";
          if (step.key === "stone_size" && formValues.multi_stone_style === "Cluster") {
            return "Which centre stone size?";
          }
          if (step.key === "stone_type" && formValues.multi_stone_style === "Cluster") {
            return "Which centre stone type?";
          }
          if (step.key === "stone_type" && ["Toi et Moi", "Trilogy"].includes(formValues.multi_stone_style)) {
            return "Which stone types?";
          }
          if (step.key === "gemstone_type" && ["Toi et Moi", "Trilogy"].includes(formValues.multi_stone_style)) {
            return "Which gemstones?";
          }
          return step.label || "";
        }

        function getStepOptions(step){
          if (!step) return [];
          if (step.key === "stone_type" && formValues.multi_stone_style === "Toi et Moi") {
            return ["Lab-grown diamonds", "Natural diamonds", "Natural gemstones", "Lab gemstones", "Natural gemstone & Diamond", "Lab gemstone & Diamond", "Not sure yet"];
          }
          if (step.key === "stone_type" && formValues.multi_stone_style === "Trilogy") {
            return ["Lab-grown diamonds", "Natural diamonds", "Natural gemstones", "Lab gemstones", "Not sure yet"];
          }
          return step.options || [];
        }

        function getChoiceBadge(step, option){
          if (!step || !option) return "";
          if (step.key === "multi_stone_style" && option === "Solitaire") return "Most popular";
          if (step.key === "halo_style_detail" && ["Round", "Oval"].includes(option)) {
            return "Most popular";
          }
          if (step.key === "stone_shape" && formValues.multi_stone_style !== "Bezel" && ["Round", "Oval"].includes(option)) {
            return "Most popular";
          }
          return "";
        }

        function normalizeChoiceValue(value){
          return String(value || "")
            .trim()
            .toLowerCase()
            .replace(/\s+/g, " ")
            .replace(/\bdiamonds\b/g, "diamond")
            .replace(/\bgemstones\b/g, "gemstone");
        }

        function isSelectedChoice(step, option){
          return normalizeChoiceValue(getStepValue(step)) === normalizeChoiceValue(option);
        }

        function getRingImageAssetUrl(fileName){
          return `./Images/Ringpage%20Form%20Background%20Images/${encodeURIComponent(fileName)}`;
        }

        function getSettingDesignImageUrl(selection){
          if (isUnsureChoiceValue(selection) || normalizeChoiceValue(selection) === "other") {
            return getRingImageAssetUrl("zoomed in no stone.png");
          }
          const fileName = settingDesignImageMap[selection] || settingDesignImageMap["Classic"];
          return getRingImageAssetUrl(fileName);
        }

        function getChoiceOptionClass(step, option){
          if (!step || !option) return "";
          if (step.key !== "ring_metal") return "";
          return `guided-choice--metal-${normalizeChoiceValue(option).replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "")}`;
        }

        function renderGuide(step){
          if (!guideEl || !guideBodyEl) return;
          if (!step || introActive) {
            guideEl.hidden = true;
            guideEl.open = false;
            guideBodyEl.innerHTML = "";
            return;
          }

          const copy = guideCopyByStepKey[step.key] || [
            "This step helps narrow down the design direction so the ring visual and quote become more accurate.",
            "If you are unsure, choose the closest option and keep moving."
          ];
          if (!copy || !copy.length) {
            guideEl.hidden = true;
            guideEl.open = false;
            guideBodyEl.innerHTML = "";
            return;
          }

          guideBodyEl.innerHTML = copy.map((paragraph) => `<p>${paragraph}</p>`).join("");
          guideEl.hidden = false;
          guideEl.open = false;
        }

        function renderChoiceStep(step){
          const list = document.createElement("div");
          list.className = "guided-choice-list";
          const requiresManualAdvance = ["setting_design", "design_request_type"].includes(step.key);
          const isSplitColumnStep = ["ring_metal", "multi_stone_style", "stone_type", "trilogy_centre_shape", "trilogy_side_shape", "toi_et_moi_first_shape", "toi_et_moi_second_shape", "toi_et_moi_first_stone_type", "toi_et_moi_second_stone_type", "stone_shape"].includes(step.key);
          const isStoneShapeStep = ["stone_shape", "toi_et_moi_first_shape", "toi_et_moi_second_shape", "trilogy_centre_shape", "trilogy_side_shape"].includes(step.key);
          if (isSplitColumnStep) {
            list.classList.add("guided-choice-list--grid");
          }
          if (step.key === "setting_design") {
            list.classList.add("guided-choice-list--setting-design");
          }
          if (isStoneShapeStep) {
            list.classList.add("guided-choice-list--stone-shapes");
          }
          if (step.key === "gemstone_type") {
            list.classList.add("guided-choice-list--gemstones");
          }

          const columns = isSplitColumnStep
            ? [document.createElement("div"), document.createElement("div")]
            : null;
          if (columns) {
            columns.forEach((column) => {
              column.className = "guided-choice-list__column";
              list.appendChild(column);
            });
          }

          getStepOptions(step).forEach((option, index) => {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "guided-choice";
            const optionClassName = getChoiceOptionClass(step, option);
            if (optionClassName) button.classList.add(optionClassName);
            const isSelected = isSelectedChoice(step, option);
            button.setAttribute("aria-pressed", String(isSelected));
            if (isSelected) {
              button.classList.add("is-selected");
            }
            const label = document.createElement("span");
            label.textContent = option;
            button.appendChild(label);
            const badgeText = getChoiceBadge(step, option);
            if (badgeText) {
              const badge = document.createElement("span");
              badge.className = "guided-choice__tag";
              badge.textContent = badgeText;
              button.appendChild(badge);
            }
            button.addEventListener("click", () => {
              cancelChoiceAutoAdvance();
              list.querySelectorAll(".guided-choice").forEach((choice) => {
                choice.classList.remove("is-selected");
                choice.setAttribute("aria-pressed", "false");
              });
              button.classList.add("is-selected");
              button.setAttribute("aria-pressed", "true");
              setStepValue(step, option);
              if (stepSupportsOtherDetail(step) && option !== "Other") {
                delete otherDetailValues[step.key];
              }
              if (step.key === "multi_stone_style") {
                formValues.stone_shape = "";
                formValues.gemstone_type = "";
                formValues.toi_et_moi_first_shape = "";
                formValues.toi_et_moi_second_shape = "";
                formValues.toi_et_moi_first_stone_type = "";
                formValues.toi_et_moi_first_gemstone = "";
                formValues.toi_et_moi_second_stone_type = "";
                formValues.toi_et_moi_second_gemstone = "";
                formValues.trilogy_centre_shape = "";
                formValues.trilogy_side_shape = "";
                formValues.style_detail = "";
                if (["Cluster", "Toi et Moi", "Bezel"].includes(option)) {
                  formValues.setting_design = "";
                }
              }
              if (["toi_et_moi_first_shape", "toi_et_moi_second_shape"].includes(step.key)) {
                formValues.stone_shape = [formValues.toi_et_moi_first_shape, formValues.toi_et_moi_second_shape].filter(Boolean).join(", ");
              }
              if (step.key === "toi_et_moi_first_stone_type" && !["Natural gemstone", "Lab gemstone"].includes(option)) {
                formValues.toi_et_moi_first_gemstone = "";
              }
              if (step.key === "toi_et_moi_second_stone_type" && !["Natural gemstone", "Lab gemstone"].includes(option)) {
                formValues.toi_et_moi_second_gemstone = "";
              }
              if (step.key === "stone_type" && !["Natural gemstone", "Lab gemstone", "Natural gemstones", "Lab gemstones"].includes(option)) {
                formValues.gemstone_type = "";
              }
              if (step.key === "pave_band" && option !== "Yes") {
                formValues.pave_coverage = "";
              }
              syncHiddenFields();
              setStatus("");
              if (step.key === "ring_metal") applyMetalTheme(option);
              if (requiresManualAdvance) {
                designFlowEl?.style.setProperty("--setting-focus-image", `url("${getSettingDesignImageUrl(option)}")`);
                triggerRingImageTransform(resolveDisplayedRingImage(step), true);
                renderMobilePreview(step, resolveDisplayedRingImage(step));
              }
              if (!requiresManualAdvance && stepIndex < steps.length - 1) {
                const autoAdvanceDelay = step.key === "pave_coverage" && option === "Half pavé" ? 800 : 300;
                scheduleChoiceAutoAdvance(step, autoAdvanceDelay);
              }
              if (requiresManualAdvance) {
                nextBtn.hidden = false;
                nextBtn.textContent = "Next";
                nextBtn.disabled = false;
              }
            });
            if (columns) {
              if (isStoneShapeStep) {
                const options = getStepOptions(step);
                const splitIndex = Math.ceil(options.length / 2);
                columns[index < splitIndex ? 0 : 1].appendChild(button);
              } else {
                columns[index % 2].appendChild(button);
              }
            } else {
              list.appendChild(button);
            }
          });

          bodyEl.appendChild(list);
          if (step.key === "design_request_type") {
            renderLeadCaptureFields(bodyEl);
          }
          if (step.key === "setting_design") {
            const designOwnButton = document.createElement("button");
            designOwnButton.type = "button";
            designOwnButton.className = "guided-skip";
            designOwnButton.textContent = "Design your own";
            designOwnButton.addEventListener("click", () => {
              cancelChoiceAutoAdvance();
              setStepValue(step, "Other");
              designFlowEl?.style.setProperty("--setting-focus-image", `url("${getSettingDesignImageUrl("Other")}")`);
              triggerRingImageTransform(resolveDisplayedRingImage(step), true);
              renderMobilePreview(step, resolveDisplayedRingImage(step));
              syncHiddenFields();
              setStatus("");
              jumpToStep("other_notes");
            });
            bodyEl.appendChild(designOwnButton);
          }
          if (requiresManualAdvance) {
            nextBtn.hidden = false;
            nextBtn.textContent = "Next";
            nextBtn.disabled = !String(getStepValue(step) || "").trim();
          } else {
            nextBtn.hidden = true;
          }
        }

        function renderMultiChoiceStep(step){
          const list = document.createElement("div");
          list.className = "guided-choice-list";
          if (["toi_et_moi_shapes", "toi_et_moi_gemstones"].includes(step.key)) {
            list.classList.add("guided-choice-list--paired-shapes");
          }

          const currentValues = Array.isArray(getStepValue(step))
            ? getStepValue(step)
            : String(getStepValue(step) || "")
                .split(",")
                .map((item) => item.trim())
                .filter(Boolean);

          step.options.forEach((option) => {
            const selectedCount = currentValues.filter((value) => value === option).length;
            if (["toi_et_moi_shapes", "toi_et_moi_gemstones"].includes(step.key)) {
              const row = document.createElement("div");
              row.className = "guided-choice-row";

              const button = document.createElement("button");
              button.type = "button";
              button.className = "guided-choice";
              button.textContent = option;
              if (selectedCount > 0) button.classList.add("is-selected");
              button.addEventListener("click", () => {
                const selected = String(getStepValue(step) || "")
                  .split(",")
                  .map((item) => item.trim())
                  .filter(Boolean);

                const index = selected.indexOf(option);
                if (index >= 0) {
                  selected.splice(index, 1);
                } else if (selected.length < (step.maxSelections || 2)) {
                  selected.push(option);
                }

                setStepValue(step, selected.join(", "));
                syncHiddenFields();
                setStatus("");
                if (selected.length === (step.maxSelections || 2)) {
                  moveToNextStep();
                  renderStep();
                  return;
                }
                renderStep();
              });

              const duplicateBtn = document.createElement("button");
              duplicateBtn.type = "button";
              duplicateBtn.className = "guided-choice guided-choice--duplicate";
              duplicateBtn.innerHTML = '<span class="guided-choice__badge">x2</span>';
              if (selectedCount === 2) duplicateBtn.classList.add("is-selected");
              duplicateBtn.setAttribute("aria-label", `${option} twice`);
              duplicateBtn.addEventListener("click", () => {
                setStepValue(step, `${option}, ${option}`);
                syncHiddenFields();
                setStatus("");
                moveToNextStep();
                renderStep();
              });

              row.appendChild(button);
              row.appendChild(duplicateBtn);
              list.appendChild(row);
              return;
            }

            const button = document.createElement("button");
            button.type = "button";
            button.className = "guided-choice";
            button.textContent = option;
            if (currentValues.includes(option)) button.classList.add("is-selected");
            button.addEventListener("click", () => {
              const selected = Array.isArray(getStepValue(step))
                ? [...getStepValue(step)]
                : String(getStepValue(step) || "")
                    .split(",")
                    .map((item) => item.trim())
                    .filter(Boolean);

              const index = selected.indexOf(option);
              if (index >= 0) {
                selected.splice(index, 1);
              } else if (selected.length < (step.maxSelections || 2)) {
                selected.push(option);
              }

              setStepValue(step, selected.join(", "));
              if (stepSupportsOtherDetail(step) && !selected.includes("Other")) {
                delete otherDetailValues[step.key];
              }
              syncHiddenFields();
              setStatus("");
              if (["toi_et_moi_shapes", "toi_et_moi_gemstones"].includes(step.key) && selected.length === (step.maxSelections || 2)) {
                moveToNextStep();
                renderStep();
                return;
              }
              renderStep();
            });
            list.appendChild(button);
          });

          bodyEl.appendChild(list);
          nextBtn.hidden = ["toi_et_moi_shapes"].includes(step.key);
          nextBtn.textContent = "Next";
          nextBtn.disabled = currentValues.length !== (step.maxSelections || 2);
        }

        function formatStoneSize(value){
          if (value === "More than one stone") return value;
          const numericValue = Number(value);
          if (!Number.isFinite(numericValue)) return "0 ct";
          if (numericValue >= 8) return "8+ ct";
          const rounded = Math.round(numericValue * 10) / 10;

        function renderRangeStep(step){
          const wrap = document.createElement("div");

          const range = document.createElement("input");
          range.type = "range";
          range.className = "guided-range__input";
          const isBudgetStep = step.key === "budget";
          const isDiscreteValueStep = Array.isArray(step.values) && step.values.length > 0;
          const currency = getCurrencyConfig();
          range.min = String(isDiscreteValueStep ? 0 : (isBudgetStep ? currency.min : (step.min ?? 0)));
          range.max = String(isDiscreteValueStep ? step.values.length - 1 : (isBudgetStep ? currency.max : (step.max ?? 8)));
          range.step = String(isDiscreteValueStep ? 1 : (isBudgetStep ? currency.step : (step.step ?? 0.1)));

          const defaultValue = isDiscreteValueStep
            ? Math.max(Math.floor(step.values.length / 2), 0)
            : isBudgetStep
              ? currency.min
              : Number(step.min ?? 0);
          const storedValue = formValues[step.key];
          const hasUnsureSelection = isUnsureChoiceValue(storedValue);
          const initialValue = isDiscreteValueStep
            ? storedValue !== "" && !hasUnsureSelection
              ? Math.max(step.values.indexOf(storedValue), 0)
              : defaultValue
            : storedValue !== "" && !hasUnsureSelection
              ? Number(storedValue)
              : defaultValue;
          range.value = String(initialValue);

          const scale = document.createElement("div");
          scale.className = "guided-range__scale";
          if (isDiscreteValueStep) {
            scale.innerHTML = "";
          } else {

              ? `<span>${formatBudgetValue(range.min)}</span><span>${formatBudgetValue(range.max)}+</span>`
              : "<span>0 ct</span><span>8+ ct</span>";
          }

          const syncValue = () => {
            const discreteValue = isDiscreteValueStep
              ? step.values[Math.min(Math.max(Number(range.value), 0), step.values.length - 1)]
              : "";
            formValues[step.key] = isDiscreteValueStep ? discreteValue : range.value;
            syncHiddenFields();
            if (isDiscreteValueStep) {
              valueLabel.textContent = formatRingSize(discreteValue);
            } else {
              valueLabel.textContent = isBudgetStep ? formatBudgetValue(range.value) : formatStoneSize(range.value);
            }
            setStatus("");
          };

          range.addEventListener("input", syncValue);
          if (hasUnsureSelection) {
            valueLabel.textContent = storedValue;

            optionInput.name = "quickStartIntroAttachPreferredContact";
            optionInput.value = option;
            optionInput.checked = (formValues.preferred_contact || "Email") === option;
            optionInput.addEventListener("change", () => {
              formValues.preferred_contact = option;
              attachContactInput.value = option === "Email" ? formValues.email || "" : formValues.phone || "";
              attachContactInput.placeholder = option === "Email" ? "Email address" : "WhatsApp number";
              syncHiddenFields();
              setStatus("");
            });

            const optionText = document.createElement("span");
            optionText.textContent = option;

            optionLabel.appendChild(optionInput);
            optionLabel.appendChild(optionText);
            attachContactOptions.appendChild(optionLabel);
          });

          attachContactInput.placeholder = formValues.preferred_contact === "Email" ? "Email address" : "WhatsApp number";

          const refreshAttachUploadMeta = () => {
            attachUploadMeta.textContent = formatReferenceFilesMeta();
            setStatus(validateReferenceImages());
          };

          const attachSubmitButton = document.createElement("button");
          attachSubmitButton.type = "button";
          attachSubmitButton.className = "btn";
          attachSubmitButton.textContent = "Submit";
          attachSubmitButton.addEventListener("click", () => submitAttachImagesLead(attachSubmitButton));

          attachPopupFields.appendChild(attachUploadMeta);
          attachPopupFields.appendChild(attachContactOptions);
          attachPopupFields.appendChild(attachContactInput);
          attachPopupFields.appendChild(attachSubmitButton);

          attachPopup.appendChild(attachCloseButton);
          attachPopup.appendChild(attachPopupFields);
          popupHost.appendChild(attachPopup);
          actionsWrap.appendChild(popupHost);
          renderIntroReviewCarousel(introEl);
          bodyEl.appendChild(actionsWrap);

          const refreshIntroAttachmentMeta = () => {
            attachmentsMeta.textContent = formatReferenceFilesMeta();
            setStatus(validateReferenceImages());
            refreshAttachUploadMeta();
          };
          referenceImageInputs.forEach((input) => {
            input.onchange = refreshIntroAttachmentMeta;
          });
        }

        function renderStep(){
          if (introActive) {
            renderIntroScreen();
            return;
          }
          stopIntroReviewRotation();
          introEl?.querySelector(".guided-intro-reviews")?.remove();
          if (summaryScreenActive) {
            renderSummaryScreen();
            return;
          }
          cancelChoiceAutoAdvance();
          while (stepIndex < steps.length && !shouldShowStep(steps[stepIndex])) {
            stepIndex += 1;
          }
          const step = steps[stepIndex];
          if (!step || !questionEl || !supportEl || !introEl || !bodyEl || !noteEl || !nextBtn) return;
          updateProgress();
          const hasSelectedMetal = Boolean(formValues.ring_metal);
          const nextRingImage = resolveDisplayedRingImage(step);
          const isEmailCaptureStep = step.type === "email-capture";
          if (isEmailCaptureStep) {
            summaryScreenActive = true;
            renderSummaryScreen();
            return;
          }
          const showTrustRow = stepIndex === 0;

          designFlowEl?.classList.add("design-flow--steps");
          designFlowEl?.classList.remove("design-flow--setting-focus");
          designFlowEl?.style.removeProperty("--setting-focus-image");
          shellEl.classList.remove("guided-form--intro");
          shellEl.classList.remove("guided-form--summary");
          questionEl.textContent = isEmailCaptureStep ? "" : getStepLabel(step);
          supportEl.textContent = isEmailCaptureStep ? "" : step.support;
          if (trustEl) trustEl.hidden = !showTrustRow;
          shellEl.classList.toggle("guided-form--metal", hasSelectedMetal);
          shellEl.classList.toggle("guided-form--email-popup", isEmailCaptureStep);
          shellEl.classList.toggle("guided-form--style-preview", step.key === "multi_stone_style");
          shellEl.classList.toggle("guided-form--cathedral-overlay", nextRingImage === "cathedral");
          shellEl.classList.toggle("guided-form--solitaire-round-image", nextRingImage === "solitaire-round");
          shellEl.classList.toggle("guided-form--solitaire-round-plain-image", nextRingImage === "solitaire-round-plain");
          shellEl.classList.toggle("guided-form--solitaire-oval-image", nextRingImage === "solitaire-oval");
          shellEl.classList.toggle("guided-form--solitaire-emerald-image", nextRingImage === "solitaire-emerald");
          shellEl.classList.toggle("guided-form--solitaire-radiant-image", nextRingImage === "solitaire-radiant");
          shellEl.classList.toggle("guided-form--solitaire-princess-image", nextRingImage === "solitaire-princess");
          shellEl.classList.toggle("guided-form--solitaire-cushion-image", nextRingImage === "solitaire-cushion");
          shellEl.classList.toggle("guided-form--solitaire-pear-image", nextRingImage === "solitaire-pear");
          shellEl.classList.toggle("guided-form--solitaire-marquise-image", nextRingImage === "solitaire-marquise");
          shellEl.classList.toggle("guided-form--halo-image", nextRingImage === "halo");
          shellEl.classList.toggle("guided-form--halo-overlay", step.key !== "setting_design" && shouldShowHaloImage(step) && formValues.style_detail !== "Hidden halo");
          shellEl.classList.toggle("guided-form--hidden-halo-overlay", step.key !== "setting_design" && shouldShowHaloImage(step) && formValues.style_detail === "Hidden halo");
          shellEl.classList.toggle("guided-form--tulip-overlay", false);
          shellEl.classList.toggle("guided-form--tulip-image", false);
          shellEl.classList.toggle("guided-form--classic-image", false);
          shellEl.classList.toggle("guided-form--tulip-setting-zoom", false);
          shellEl.classList.toggle("guided-form--classic-setting-zoom", false);
          shellEl.classList.toggle("guided-form--setting-focus", step.key === "setting_design");
          shellEl.classList.toggle("guided-form--bezel-image", formValues.multi_stone_style === "Bezel");
          shellEl.classList.toggle("guided-form--trilogy-image", nextRingImage === "trilogy");
          shellEl.classList.toggle("guided-form--trilogy-large-centre-image", nextRingImage === "trilogy-large-centre");
          shellEl.classList.toggle("guided-form--toi-et-moi-image", nextRingImage === "toi-et-moi");
          shellEl.classList.toggle("guided-form--cluster-image", nextRingImage === "cluster");
          shellEl.classList.toggle("guided-form--pave-overlay", step.key !== "setting_design" && formValues.pave_band === "Yes" && formValues.pave_coverage !== "Half pavé");
          shellEl.classList.toggle("guided-form--pave-overlay-half", step.key !== "setting_design" && formValues.pave_band === "Yes" && formValues.pave_coverage === "Half pavé");
          triggerRingImageTransform(nextRingImage);
          renderMobilePreview(step, nextRingImage);
          introEl.classList.toggle("guided-form__intro--metal", hasSelectedMetal);
          questionEl.classList.toggle("guided-form__question--metal", hasSelectedMetal);
          supportEl.classList.toggle("guided-form__support--metal", hasSelectedMetal);
          renderGuide(step);
          if (hasSelectedMetal) {
            applyMetalTheme(formValues.ring_metal);
          } else {
            clearMetalTheme();
          }
          supportEl.classList.toggle("guided-form__support--phone", isEmailCaptureStep);
          noteEl.textContent = "";
          noteEl.classList.remove("guided-form__note--reassurance");
          bodyEl.innerHTML = "";
          if (nextBtn && nextBtn.parentElement && nextBtn.parentElement.classList.contains("guided-form__footer")) {
            const footerEl = nextBtn.parentElement;
            if (guideEl && guideEl.parentElement === shellEl) {
              guideEl.insertAdjacentElement("afterend", footerEl);
            } else if (previewEl && previewEl.parentElement === shellEl) {
              previewEl.insertAdjacentElement("afterend", footerEl);
            }
          }
          shellEl.classList.toggle("guided-form--step-one", stepIndex === 0);
          if (backBtn) backBtn.hidden = stepIndex === 0;
          nextBtn.hidden = false;
          nextBtn.disabled = false;
          requestAnimationFrame(() => questionEl.focus({ preventScroll: true }));
          if (step.type === "choice") {
            renderChoiceStep(step);
          } else if (step.type === "multi-choice") {
            renderMultiChoiceStep(step);
          } else if (step.type === "dual-range") {
            renderDualRangeStep(step);
          } else if (step.type === "range") {
            renderRangeStep(step);
          } else {
            renderInputStep(step);
          }
        }

        function validateContactDetails(){
          const email = String(formValues.email || "").trim();
          const phone = String(formValues.phone || "").trim();
          const preferredContact = String(formValues.preferred_contact || "").trim();

          if (!email && !phone) return "Please add an email address or contact number.";
          if (email && !isValidEmail(email)) return "Please add a valid email address.";
          if (phone && !isValidPhone(phone)) return "Please add a valid contact number.";
          if (!preferredContact) return "Please choose a preferred contact method.";
          if (preferredContact === "Email" && !email) return "Please add an email address for email contact.";
          if (preferredContact === "WhatsApp" && !phone) {
            return "Please add a contact number for WhatsApp.";
          }
          return "";
        }

        function validateReferenceImages(){
          const files = getReferenceFiles();
          const totalBytes = files.reduce((sum, file) => sum + file.size, 0);
          if (totalBytes > MAX_UPLOAD_BYTES) return "Your attachments must be under 8 MB in total.";
          return "";
        }

        function submitQuickStart(){
          if (isSubmitting) return;
          isSubmitting = true;
          if (hiddenFields.submission_type) hiddenFields.submission_type.value = "complete";
          syncHiddenFields();
          setStatus("");
          activeSubmitButton = nextBtn;
          nextBtn.disabled = true;
          nextBtn.textContent = "Sending...";
          form.requestSubmit();
        }

        nextBtn.addEventListener("click", () => {
          if (introActive) {
            introActive = false;
            summaryScreenActive = false;
            renderStep();
            return;
          }

          if (summaryScreenActive) {
            const validationMessage = validateContactDetails() || validateReferenceImages();
            if (validationMessage) {
              setStatus(validationMessage);
              return;
            }
            submitQuickStart();
            return;
          }

          const step = steps[stepIndex];
          if (!step) return;

          if (step.type === "choice") {
            const selected = String(getStepValue(step) || "").trim();
            if (!selected) {
              setStatus("Please select an option.");
              return;
            }
            syncHiddenFields();
            moveToNextStep();
            renderStep();
            return;
          }

          if (step.type === "textarea") {
            syncHiddenFields();
            moveToNextStep();
            renderStep();
            return;
          }

          if (step.type === "multi-choice") {
            const selected = String(getStepValue(step) || "").split(",").map((item) => item.trim()).filter(Boolean);
            if (selected.length !== (step.maxSelections || 2)) {
              setStatus(`Please select ${step.maxSelections || 2}.`);
              return;
            }
            syncHiddenFields();
            moveToNextStep();
            renderStep();
            return;
          }

          if (step.type === "dual-range") {
            syncHiddenFields();
            moveToNextStep();
            renderStep();
            return;
          }

          if (step.type === "range") {
            syncHiddenFields();
            moveToNextStep();
            renderStep();
            return;
          }

          if (step.type === "email-capture") {
            summaryScreenActive = true;
            renderSummaryScreen();
          }
        });

        backBtn?.addEventListener("click", () => {
          cancelChoiceAutoAdvance();
          if (introActive) return;
          if (summaryScreenActive) {
            summaryScreenActive = false;
            renderStep();
            return;
          }
          if (stepIndex <= 0) {
            introActive = true;
            renderIntroScreen();
            return;
          }

          moveToPreviousStep();
          if (stepIndex < 0) {
            introActive = true;
            renderIntroScreen();
            return;
          }

          renderStep();
        });

        if (locationField) {
          const locale = navigator.language || "en-GB";
          const localeCountry = (locale.split("-")[1] || "GB").toUpperCase();
          const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone || "Unknown";
          if (currencyByCountryCode[localeCountry]) {
            visitorCurrency = currencyByCountryCode[localeCountry];
            visitorCountryCode = localeCountry;
          }
          locationField.value = `Browser locale: ${locale} | Time zone: ${timeZone} | Currency: ${getCurrencyConfig().code} | Country code: ${visitorCountryCode}`;
          if (!formValues.budget) {
            formValues.budget = String(getCurrencyConfig().min);
            syncHiddenFields();
          }
        }

        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          const validationMessage = validateContactDetails() || validateReferenceImages();
          if (validationMessage) {
            isSubmitting = false;
            if (activeSubmitButton) {
              activeSubmitButton.disabled = false;
              activeSubmitButton.textContent = activeSubmitButton === nextBtn ? "Request my design & quote" : "Request complimentary design";
            }
            setStatus(validationMessage);
            return;
          }

          try {
            syncHiddenFields();
            const response = await fetch("/", {
              method: "POST",
              body: new FormData(form)
            });
            if (!response.ok) throw new Error(`Form submission failed with status ${response.status}`);

            if (typeof gtag === "function") {
              gtag("event", "generate_lead", {
                form_name: form.getAttribute("name") || "ringpage-quick-start",
                preferred_contact: formValues.preferred_contact || "",
                currency: getCurrencyConfig().code
              });
            }

            isSubmitting = false;
            stopIntroReviewRotation();
            summaryScreenActive = false;
            shellEl.classList.remove("guided-form--summary", "guided-form--intro");
            shellEl.classList.add("guided-form--success");
            if (progressEl) progressEl.hidden = true;
            if (trustEl) trustEl.hidden = true;
            if (previewEl) {
              previewEl.hidden = true;
              previewEl.setAttribute("aria-hidden", "true");
            }
            if (guideEl) guideEl.hidden = true;
            if (bodyEl) bodyEl.innerHTML = "";
            if (noteEl) noteEl.textContent = "";
            if (nextBtn?.parentElement) nextBtn.parentElement.hidden = true;
            questionEl.textContent = "Thank you — your ring request is in";
            supportEl.textContent = "We’ll review your choices personally and contact you shortly with the best next step.";
            questionEl.focus({ preventScroll:true });
          } catch (error) {
            console.error(error);
            isSubmitting = false;
            if (activeSubmitButton) {
              activeSubmitButton.disabled = false;
              activeSubmitButton.textContent = activeSubmitButton === nextBtn ? "Request my design & quote" : "Request complimentary design";
            }
            setStatus("We couldn’t send your enquiry. Please check your connection and try again.");
          }
        });

        syncHiddenFields();
        if (shouldSkipQuickStartIntro) {
          introActive = false;
          renderStep();
        } else {
          renderIntroScreen();
        }
      })();

    </script>
  </body>
  </html>
