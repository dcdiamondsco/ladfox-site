          formValues.multi_stone_style === "Not sure yet" ||
          formValues.stone_shape === "Not sure yet" ||
          formValues.halo_style_detail === "Not sure yet" ||
          formValues.trilogy_style_detail === "Not sure yet" ||
          formValues.setting_design === "Not sure yet" ||
          formValues.pave_band === "Not sure yet"
        ) {
          return "solitaire-round";
        }
        if (formValues.multi_stone_style === "Halo" && formValues.stone_shape === "Emerald") return "solitaire-emerald";
        if (formValues.multi_stone_style === "Halo" && formValues.stone_shape === "Oval") return "solitaire-oval";
        if (formValues.multi_stone_style === "Halo" && formValues.stone_shape === "Radiant") return "solitaire-radiant";
        if (formValues.multi_stone_style === "Halo" && formValues.stone_shape === "Princess") return "solitaire-princess";
        if (formValues.multi_stone_style === "Halo" && formValues.stone_shape === "Cushion") return "solitaire-cushion";
        if (formValues.multi_stone_style === "Halo" && formValues.stone_shape === "Pear") return "solitaire-pear";
        if (formValues.multi_stone_style === "Halo" && formValues.stone_shape === "Marquise") return "solitaire-marquise";
        if (formValues.multi_stone_style === "Halo" && formValues.stone_shape === "Round") return "solitaire-round";
        if (formValues.multi_stone_style === "Solitaire" && formValues.stone_shape === "Emerald") return "solitaire-emerald";
        if (formValues.multi_stone_style === "Solitaire" && formValues.stone_shape === "Oval") return "solitaire-oval";
        if (formValues.multi_stone_style === "Solitaire" && formValues.stone_shape === "Radiant") return "solitaire-radiant";
        if (formValues.multi_stone_style === "Solitaire" && formValues.stone_shape === "Princess") return "solitaire-princess";
        if (formValues.multi_stone_style === "Solitaire" && formValues.stone_shape === "Cushion") return "solitaire-cushion";
        if (formValues.multi_stone_style === "Solitaire" && formValues.stone_shape === "Pear") return "solitaire-pear";
        if (formValues.multi_stone_style === "Solitaire" && formValues.stone_shape === "Marquise") return "solitaire-marquise";
        if (formValues.multi_stone_style === "Solitaire" && formValues.stone_shape === "Round") return "solitaire-round";
        if (shouldShowSolitaireRoundImage(step)) return "solitaire-round";
        if (shouldShowSolitaireRoundPlainImage(step)) return "solitaire-round-plain";
        if (shouldShowSolitaireOvalImage(step)) return "solitaire-oval";
        if (shouldShowSolitaireEmeraldImage(step)) return "solitaire-emerald";
        if (shouldShowSolitaireRadiantImage(step)) return "solitaire-radiant";
        if (shouldShowSolitairePrincessImage(step)) return "solitaire-princess";
        if (shouldShowSolitaireCushionImage(step)) return "solitaire-cushion";
        if (shouldShowSolitairePearImage(step)) return "solitaire-pear";
        if (shouldShowSolitaireMarquiseImage(step)) return "solitaire-marquise";
        if (shouldShowHaloImage(step)) return "halo";
        if (shouldShowCathedralOverlay(step)) return "cathedral";
        if (shouldShowToiEtMoiImage(step)) return "toi-et-moi";
        if (shouldShowClusterImage(step)) return "cluster";
        if (shouldShowTrilogyLargeCentreImage(step)) return "trilogy-large-centre";
        if (shouldShowTrilogyImage(step)) return "trilogy";
        return "plain";
      }

      function resolveDisplayedRingImage(step){
        const nextRingImage = getRingImageState(step);
        if (["pave_coverage", "setting_design"].includes(step?.key) && activeRingImage !== "plain") {
          return activeRingImage;
        }
        if (step?.key === "pave_band" && nextRingImage === "plain" && activeRingImage !== "plain") {
          return activeRingImage;
        }
        return nextRingImage;
      }

      function getMobilePreviewImage(step, nextRingImage){
        const imageBase = "./Images/Ringpage Form Background Images/";
        if (formValues.multi_stone_style === "Bezel") return `${imageBase}bezel.png`;
        if (shouldShowSettingDesignImage() && formValues.setting_design === "Tulip/Floral") return `${imageBase}tulip.png`;
        if (shouldShowSettingDesignImage() && formValues.setting_design === "Classic") return `${imageBase}classic.png`;

        const imageMap = {
          "plain": `${imageBase}1 Plain ring.png`,
          "cathedral": `${imageBase}2 Solitaire no stone.png`,
          "halo": `${imageBase}2 Solitaire no stone.png`,
          "solitaire-round": `${imageBase}3 Solitaire round.png`,
          "solitaire-round-plain": `${imageBase}4 Solitaire round plain.png`,
          "solitaire-oval": `${imageBase}3 Solitaire oval.png`,
          "solitaire-emerald": `${imageBase}3 Solitaire Emerald.png`,
          "solitaire-radiant": `${imageBase}3 Solitaire radient.png`,
          "solitaire-princess": `${imageBase}3 Solitaire princess.png`,
          "solitaire-cushion": `${imageBase}3 Solitaire cushion.png`,
          "solitaire-pear": `${imageBase}3 Solitaire pear.png`,
          "solitaire-marquise": `${imageBase}3 Solitaire Marquise.png`,
          "trilogy": `${imageBase}4 Trilogy.png`,
          "trilogy-large-centre": `${imageBase}4 Trilogy.png`,
          "toi-et-moi": `${imageBase}Toi et moi.png`,
          "cluster": `${imageBase}cluster.png`
        };

        return imageMap[nextRingImage] || imageMap.plain;
      }

      function renderMobilePreview(step, nextRingImage){
        if (!previewEl) return;
        if (!step || introActive || summaryScreenActive) {
          previewEl.hidden = true;
          previewEl.style.removeProperty("--mobile-preview-image");
          return;
        }

        const previewImage = getMobilePreviewImage(step, nextRingImage);
        if (!previewImage) {
          previewEl.hidden = true;
          previewEl.style.removeProperty("--mobile-preview-image");
          return;
        }

        previewEl.hidden = false;
        previewEl.style.setProperty("--mobile-preview-image", `url("${previewImage}")`);
      }

      function shouldShowSettingDesignImage(){
        return ["Solitaire", "Cluster", "Halo"].includes(formValues.multi_stone_style);
      }

      function triggerRingImageTransform(nextImage, forceReplay = false){
        if (!shellEl) return;
        if (!forceReplay && nextImage === activeRingImage) return;
        activeRingImage = nextImage;
        shellEl.classList.remove("guided-form--image-transforming");
        if (imageTransformTimer) window.clearTimeout(imageTransformTimer);
        void shellEl.offsetWidth;
        shellEl.classList.add("guided-form--image-transforming");
        imageTransformTimer = window.setTimeout(() => {
          shellEl.classList.remove("guided-form--image-transforming");
        }, 90);
      }

      function moveToNextStep(){
        do {
          stepIndex += 1;
        } while (stepIndex < steps.length && !shouldShowStep(steps[stepIndex]));
      }

      function moveToPreviousStep(){
        do {
          stepIndex -= 1;
        } while (stepIndex >= 0 && !shouldShowStep(steps[stepIndex]));
      }

      function getStepValue(step){
        if (isOtherDetailStep(step)) {
          return otherDetailValues[step.otherDetailSourceKey] || "";
        }
        return formValues[step.storeKey || step.key];
      }

      function setStepValue(step, value){
        if (isOtherDetailStep(step)) {
          otherDetailValues[step.otherDetailSourceKey] = value;
          return;
        }
        formValues[step.storeKey || step.key] = value;
      }

      function getStepLabel(step){
        if (!step) return "";
        if (step.key === "stone_size" && formValues.multi_stone_style === "Cluster") {
          return "Which centre stone size?";
        }
        if (step.key === "stone_type" && formValues.multi_stone_style === "Cluster") {
          return "Which centre stone type?";
        }
        if (step.key === "stone_type" && ["Toi et moi", "Trilogy"].includes(formValues.multi_stone_style)) {
          return "Which stone types?";
        }
        if (step.key === "gemstone_type" && ["Toi et moi", "Trilogy"].includes(formValues.multi_stone_style)) {
          return "Which gemstones?";
        }
        return step.label || "";
      }

      function getStepOptions(step){
        if (!step) return [];
        if (step.key === "stone_type" && formValues.multi_stone_style === "Toi et moi") {
          return ["Lab grown diamonds", "Natural diamonds", "Gemstones", "Lab gemstones", "Gemstone & Diamond", "Lab gemstone & Diamond", "Not sure yet"];
        }
        if (step.key === "stone_type" && formValues.multi_stone_style === "Trilogy") {
          return ["Lab grown diamonds", "Natural diamonds", "Gemstones", "Lab gemstones", "Not sure yet"];
        }
        return step.options || [];
      }

      function getChoiceBadge(step, option){
        if (!step || !option) return "";
        if (step.key === "multi_stone_style" && option === "Solitaire") return "Most popular";
        if (step.key === "halo_style_detail" && ["Round", "Oval"].includes(option)) {
          return "Most popular";
        }
        if (step.key === "stone_shape" && formValues.multi_stone_style !== "Bezel" && ["Round", "Oval"].includes(option)) {
          return "Most popular";
        }
        return "";
      }

      function normalizeChoiceValue(value){
        return String(value || "")
          .trim()
          .toLowerCase()
          .replace(/\s+/g, " ")
          .replace(/\bdiamonds\b/g, "diamond")
          .replace(/\bgemstones\b/g, "gemstone");
      }

      function isSelectedChoice(step, option){
        return normalizeChoiceValue(getStepValue(step)) === normalizeChoiceValue(option);
      }

      function renderGuide(step){
        if (!guideEl || !guideBodyEl) return;
        if (!step || introActive) {
          guideEl.hidden = true;
          guideEl.open = false;
          guideBodyEl.innerHTML = "";
          return;
        }

        const copy = guideCopyByStepKey[step.key] || [
          "This step helps narrow down the design direction so the ring visual and quote become more accurate.",
          "If you are unsure, choose the closest option and keep moving."
        ];
        if (!copy || !copy.length) {
          guideEl.hidden = true;
          guideEl.open = false;
          guideBodyEl.innerHTML = "";
          return;
        }

        guideBodyEl.innerHTML = copy.map((paragraph) => `<p>${paragraph}</p>`).join("");
        guideEl.hidden = false;
        guideEl.open = false;
      }

      function renderChoiceStep(step){
        const list = document.createElement("div");
        list.className = "guided-choice-list";
        const isSplitColumnStep = ["ring_metal", "multi_stone_style", "stone_type", "trilogy_centre_shape", "trilogy_side_shape", "toi_et_moi_first_shape", "toi_et_moi_second_shape", "toi_et_moi_first_stone_type", "toi_et_moi_second_stone_type", "stone_shape"].includes(step.key);
        const isStoneShapeStep = ["stone_shape", "toi_et_moi_first_shape", "toi_et_moi_second_shape", "trilogy_centre_shape", "trilogy_side_shape"].includes(step.key);
        if (isSplitColumnStep) {
          list.classList.add("guided-choice-list--grid");
        }
        if (isStoneShapeStep) {
          list.classList.add("guided-choice-list--stone-shapes");
        }
        if (step.key === "gemstone_type") {
          list.classList.add("guided-choice-list--gemstones");
        }

        const columns = isSplitColumnStep
          ? [document.createElement("div"), document.createElement("div")]
          : null;
        if (columns) {
          columns.forEach((column) => {
            column.className = "guided-choice-list__column";
            list.appendChild(column);
          });
        }

        getStepOptions(step).forEach((option, index) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "guided-choice";
          if (isSelectedChoice(step, option)) {
            button.classList.add("is-selected");
          }
          const label = document.createElement("span");
          label.textContent = option;
          button.appendChild(label);
          const badgeText = getChoiceBadge(step, option);
          if (badgeText) {
            const badge = document.createElement("span");
            badge.className = "guided-choice__tag";
            badge.textContent = badgeText;
            button.appendChild(badge);
          }
          button.addEventListener("click", () => {
            list.querySelectorAll(".guided-choice").forEach((choice) => {
              choice.classList.remove("is-selected");
              choice.disabled = true;
            });
            button.classList.add("is-selected");
            setStepValue(step, option);
            if (stepSupportsOtherDetail(step) && option !== "Other") {
              delete otherDetailValues[step.key];
            }
            if (step.key === "multi_stone_style") {
              formValues.stone_shape = "";
              formValues.gemstone_type = "";
              formValues.toi_et_moi_first_shape = "";
              formValues.toi_et_moi_second_shape = "";
              formValues.toi_et_moi_first_stone_type = "";
              formValues.toi_et_moi_first_gemstone = "";
              formValues.toi_et_moi_second_stone_type = "";
              formValues.toi_et_moi_second_gemstone = "";
              formValues.trilogy_centre_shape = "";
              formValues.trilogy_side_shape = "";
              formValues.style_detail = "";
              if (["Toi et moi", "Bezel"].includes(option)) {
                formValues.setting_design = "";
              }
            }
            if (["toi_et_moi_first_shape", "toi_et_moi_second_shape"].includes(step.key)) {
              formValues.stone_shape = [formValues.toi_et_moi_first_shape, formValues.toi_et_moi_second_shape].filter(Boolean).join(", ");
            }
            if (step.key === "toi_et_moi_first_stone_type" && !["Gemstone", "Lab gemstone"].includes(option)) {
              formValues.toi_et_moi_first_gemstone = "";
            }
            if (step.key === "toi_et_moi_second_stone_type" && !["Gemstone", "Lab gemstone"].includes(option)) {
              formValues.toi_et_moi_second_gemstone = "";
            }
            if (step.key === "stone_type" && !["Gemstone", "Lab gemstone", "Gemstones", "Lab gemstones"].includes(option)) {
              formValues.gemstone_type = "";
            }
            if (step.key === "pave_band" && option !== "Yes") {
              formValues.pave_coverage = "";
            }
            syncHiddenFields();
            setStatus("");
            if (step.key === "ring_metal") applyMetalTheme(option);
            if (stepIndex < steps.length - 1) {
              moveToNextStep();
              renderStep();
            }
          });
          if (columns) {
            columns[index % 2].appendChild(button);
          } else {
            list.appendChild(button);
          }
        });

        bodyEl.appendChild(list);
        nextBtn.hidden = true;
      }

      function renderMultiChoiceStep(step){
        const list = document.createElement("div");
        list.className = "guided-choice-list";
        if (["toi_et_moi_shapes", "toi_et_moi_gemstones"].includes(step.key)) {
          list.classList.add("guided-choice-list--paired-shapes");
        }

        const currentValues = Array.isArray(getStepValue(step))
          ? getStepValue(step)
          : String(getStepValue(step) || "")
              .split(",")
              .map((item) => item.trim())
              .filter(Boolean);

        step.options.forEach((option) => {
          const selectedCount = currentValues.filter((value) => value === option).length;
          if (["toi_et_moi_shapes", "toi_et_moi_gemstones"].includes(step.key)) {
            const row = document.createElement("div");
            row.className = "guided-choice-row";

            const button = document.createElement("button");
            button.type = "button";
            button.className = "guided-choice";
            button.textContent = option;
            if (selectedCount > 0) button.classList.add("is-selected");
            button.addEventListener("click", () => {
              const selected = String(getStepValue(step) || "")
                .split(",")
                .map((item) => item.trim())
                .filter(Boolean);

              const index = selected.indexOf(option);
              if (index >= 0) {
                selected.splice(index, 1);
              } else if (selected.length < (step.maxSelections || 2)) {
                selected.push(option);
              }

              setStepValue(step, selected.join(", "));
              syncHiddenFields();
              setStatus("");
              if (selected.length === (step.maxSelections || 2)) {
                moveToNextStep();
                renderStep();
                return;
              }
              renderStep();
            });

            const duplicateBtn = document.createElement("button");
            duplicateBtn.type = "button";
            duplicateBtn.className = "guided-choice guided-choice--duplicate";
            duplicateBtn.innerHTML = '<span class="guided-choice__badge">x2</span>';
            if (selectedCount === 2) duplicateBtn.classList.add("is-selected");
            duplicateBtn.setAttribute("aria-label", `${option} twice`);
            duplicateBtn.addEventListener("click", () => {
              setStepValue(step, `${option}, ${option}`);
              syncHiddenFields();
              setStatus("");
              moveToNextStep();
              renderStep();
            });

            row.appendChild(button);
            row.appendChild(duplicateBtn);
            list.appendChild(row);
            return;
          }

          const button = document.createElement("button");
          button.type = "button";
          button.className = "guided-choice";
          button.textContent = option;
          if (currentValues.includes(option)) button.classList.add("is-selected");
          button.addEventListener("click", () => {
            const selected = Array.isArray(getStepValue(step))
              ? [...getStepValue(step)]
              : String(getStepValue(step) || "")
                  .split(",")
                  .map((item) => item.trim())
                  .filter(Boolean);

            const index = selected.indexOf(option);
            if (index >= 0) {
              selected.splice(index, 1);
            } else if (selected.length < (step.maxSelections || 2)) {
              selected.push(option);
            }

            setStepValue(step, selected.join(", "));
            if (stepSupportsOtherDetail(step) && !selected.includes("Other")) {
              delete otherDetailValues[step.key];
            }
            syncHiddenFields();
            setStatus("");
            if (["toi_et_moi_shapes", "toi_et_moi_gemstones"].includes(step.key) && selected.length === (step.maxSelections || 2)) {
              moveToNextStep();
              renderStep();
              return;
            }
            renderStep();
          });
          list.appendChild(button);
        });

        bodyEl.appendChild(list);
        nextBtn.hidden = ["toi_et_moi_shapes"].includes(step.key);
        nextBtn.textContent = "Next";
        nextBtn.disabled = currentValues.length !== (step.maxSelections || 2);
      }

      function formatStoneSize(value){
        if (value === "More than one stone") return value;
        const numericValue = Number(value);
        if (!Number.isFinite(numericValue)) return "0 ct";
        if (numericValue >= 8) return "8+ ct";
        const rounded = Math.round(numericValue * 10) / 10;
        const display = Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(1);
        return `${display} ct`;
      }

      function formatRingSize(value){
        return value ? `UK ${value}` : "";
      }

      function renderRangeStep(step){
        const wrap = document.createElement("div");
        wrap.className = "guided-range";
        if (step.key === "stone_size") wrap.classList.add("guided-range--stone-size");

        const valueLabel = document.createElement("p");
        valueLabel.className = "guided-range__value";

        const range = document.createElement("input");
        range.type = "range";
        range.className = "guided-range__input";
        const isBudgetStep = step.key === "budget";
        const isDiscreteValueStep = Array.isArray(step.values) && step.values.length > 0;
        const currency = getCurrencyConfig();
        range.min = String(isDiscreteValueStep ? 0 : (isBudgetStep ? currency.min : (step.min ?? 0)));
        range.max = String(isDiscreteValueStep ? step.values.length - 1 : (isBudgetStep ? currency.max : (step.max ?? 8)));
        range.step = String(isDiscreteValueStep ? 1 : (isBudgetStep ? currency.step : (step.step ?? 0.1)));

        const defaultValue = isDiscreteValueStep
          ? Math.max(Math.floor(step.values.length / 2), 0)
          : isBudgetStep
            ? currency.min
            : Number(step.min ?? 0);
        const initialValue = isDiscreteValueStep
          ? formValues[step.key] !== ""
            ? Math.max(step.values.indexOf(formValues[step.key]), 0)
            : defaultValue
          : formValues[step.key] !== ""
            ? Number(formValues[step.key])
            : defaultValue;
        range.value = String(initialValue);

        const scale = document.createElement("div");
        scale.className = "guided-range__scale";
        if (isDiscreteValueStep) {
          scale.innerHTML = "";
        } else {
          scale.innerHTML = isBudgetStep
            ? `<span>${formatBudgetValue(range.min)}</span><span>${formatBudgetValue(range.max)}+</span>`
            : "<span>0 ct</span><span>8+ ct</span>";
        }

        const syncValue = () => {
          const discreteValue = isDiscreteValueStep
            ? step.values[Math.min(Math.max(Number(range.value), 0), step.values.length - 1)]
            : "";
          formValues[step.key] = isDiscreteValueStep ? discreteValue : range.value;
          syncHiddenFields();
          if (isDiscreteValueStep) {
            valueLabel.textContent = formatRingSize(discreteValue);
          } else {
            valueLabel.textContent = isBudgetStep ? formatBudgetValue(range.value) : formatStoneSize(range.value);
          }
          setStatus("");
        };

        range.addEventListener("input", syncValue);
        syncValue();

        wrap.appendChild(valueLabel);
        wrap.appendChild(range);
        wrap.appendChild(scale);

        if (step.key === "ring_size") {
          const unknownButton = document.createElement("button");
          unknownButton.type = "button";
          unknownButton.className = "guided-range__skip";
          unknownButton.textContent = "Don't know";
          unknownButton.addEventListener("click", () => {
            formValues[step.key] = "Don't know yet";
            syncHiddenFields();
            valueLabel.textContent = "Don't know yet";
            setStatus("");
          });
          wrap.appendChild(unknownButton);
        }

        if (nextBtn && nextBtn.parentElement !== wrap) {
          wrap.appendChild(nextBtn.parentElement);
        }
        bodyEl.appendChild(wrap);

        nextBtn.hidden = false;
        nextBtn.textContent = "Next";
        requestAnimationFrame(() => range.focus());
      }

      function renderDualRangeStep(step){
        const wrap = document.createElement("div");
        wrap.className = "guided-range";

        const selectedShapes = String(formValues.stone_shape || "")
          .split(",")
          .map((item) => item.trim())
          .filter(Boolean)
          .slice(0, 2);

        const currentValues = String(getStepValue(step) || "")
          .split("|")
          .map((item) => item.trim())
          .filter(Boolean);

        const parsedValues = Object.fromEntries(
          currentValues.map((entry) => {
            const [label, value] = entry.split(":").map((part) => part.trim());
            return [label, value];
          })
        );

        const sliderFields = [];
        const labelCounts = {};

        selectedShapes.forEach((shape, index) => {
          labelCounts[shape] = (labelCounts[shape] || 0) + 1;
          const label = labelCounts[shape] > 1 ? `${shape} ${labelCounts[shape]}` : shape;
          const valueLabel = document.createElement("p");
          valueLabel.className = "guided-range__value";

          const range = document.createElement("input");
          range.type = "range";
          range.className = "guided-range__input";
          range.min = String(step.min ?? 0);
          range.max = String(step.max ?? 8);
          range.step = String(step.step ?? 0.1);
          range.value = parsedValues[label] || parsedValues[shape] || "1";

          const scale = document.createElement("div");
          scale.className = "guided-range__scale";
          scale.innerHTML = "<span>0 ct</span><span>8+ ct</span>";

          const syncValue = () => {
            const formatted = formatStoneSize(range.value);
            valueLabel.textContent = `${label} stone size: ${formatted}`;
            sliderFields[index] = `${label}: ${range.value}`;
            setStepValue(step, sliderFields.filter(Boolean).join(" | "));
            syncHiddenFields();
            setStatus("");
          };

          range.addEventListener("input", syncValue);
          syncValue();

          wrap.appendChild(valueLabel);
          wrap.appendChild(range);
          wrap.appendChild(scale);
        });

        if (nextBtn && nextBtn.parentElement !== wrap) {
          wrap.appendChild(nextBtn.parentElement);
        }
        bodyEl.appendChild(wrap);
        nextBtn.hidden = false;
        nextBtn.textContent = "Next";
      }

      function buildEmailPopup(onClose){
        const popup = document.createElement("div");
        popup.className = "guided-popup";

        const closeButton = document.createElement("button");
        closeButton.type = "button";
        closeButton.className = "guided-popup__close";
        closeButton.setAttribute("aria-label", "Close");
        closeButton.innerHTML = "x";
        closeButton.textContent = "×";
        closeButton.addEventListener("click", () => {
          if (typeof onClose === "function") onClose();
        });
        closeButton.textContent = "x";

        const eyebrow = document.createElement("p");
        eyebrow.className = "guided-popup__eyebrow";
        eyebrow.textContent = "Limited offer";

        const title = document.createElement("h4");
        title.className = "guided-popup__title";
        title.textContent = "Enter your email below for 20% off today";

        const copy = document.createElement("p");
        copy.className = "guided-popup__copy";
        copy.textContent = "";

        const field = document.createElement("input");
        field.type = "email";
        field.className = "guided-input";
        field.placeholder = "";
        field.value = "";
        field.autocomplete = "email";
        field.inputMode = "email";

        field.addEventListener("input", () => {
          formValues.email = field.value.trim();
          syncHiddenFields();
          setStatus("");
        });

        popup.appendChild(closeButton);
        popup.appendChild(eyebrow);
        popup.appendChild(title);
        popup.appendChild(copy);
        popup.appendChild(field);

        return { popup, field };
      }

      function renderEmailCaptureStep(){
        const stage = document.createElement("div");
        stage.className = "guided-popup-stage";

        const base = document.createElement("div");
        base.className = "guided-popup-stage__base";

        const placeholderField = document.createElement("input");
        placeholderField.type = "email";
        placeholderField.className = "guided-input";
        placeholderField.placeholder = "";
        placeholderField.value = "";
        placeholderField.autocomplete = "email";
        placeholderField.inputMode = "email";
        placeholderField.disabled = true;
        base.appendChild(placeholderField);

        const scrim = document.createElement("div");
        scrim.className = "guided-popup-stage__scrim";

        const { popup, field: emailField } = buildEmailPopup(() => {
          summaryScreenActive = true;
          renderSummaryScreen();
        });

        stage.appendChild(base);
        stage.appendChild(scrim);
        stage.appendChild(popup);
        bodyEl.appendChild(stage);

        nextBtn.hidden = false;
        nextBtn.textContent = "Next";
        window.setTimeout(() => {
          popup.classList.add("is-visible");
          emailField.focus();
        }, 900);
      }

      function renderSummaryScreen(){
        if (!questionEl || !supportEl || !introEl || !bodyEl || !noteEl || !nextBtn) return;
        updateProgress();
        designFlowEl?.classList.add("design-flow--steps");
        shellEl.classList.remove("guided-form--intro", "guided-form--email-popup");
        questionEl.textContent = "Review your ring details";
        supportEl.textContent = "Check the summary below and confirm the best contact details for your quote.";
        supportEl.classList.remove("guided-form__support--phone");
        noteEl.textContent = "";
        bodyEl.innerHTML = "";
        renderGuide(null);
        if (backBtn) backBtn.hidden = false;

        const summary = document.createElement("div");
        summary.className = "guided-summary";

        const list = document.createElement("div");
        list.className = "guided-summary__list";
        buildSelectionSummary().forEach((item) => {
          const row = document.createElement("div");
          row.className = "guided-summary__item";

          const content = document.createElement("div");
          content.className = "guided-summary__content";

          const label = document.createElement("div");
          label.className = "guided-summary__label";
          label.textContent = item.label;

          const value = document.createElement("div");
          value.className = "guided-summary__value";
          value.textContent = item.value;

          content.appendChild(label);
          content.appendChild(value);
          row.appendChild(content);

          if (item.editStepKey) {
            const changeButton = document.createElement("button");
            changeButton.type = "button";
            changeButton.className = "guided-summary__change";
            changeButton.textContent = "Change";
            changeButton.addEventListener("click", () => {
              jumpToStep(item.editStepKey);
            });
            row.appendChild(changeButton);
          }

          list.appendChild(row);
        });

        const fields = document.createElement("div");
        fields.className = "guided-summary__fields";

        const emailField = document.createElement("input");
        emailField.type = "email";
        emailField.className = "guided-input";
        emailField.placeholder = "Email address";
        emailField.value = formValues.email || "";
        emailField.autocomplete = "email";
        emailField.inputMode = "email";
        emailField.addEventListener("input", () => {
          formValues.email = emailField.value.trim();
          syncHiddenFields();
          setStatus("");
        });

        const phoneField = document.createElement("input");
        phoneField.type = "tel";
        phoneField.className = "guided-input";
        phoneField.placeholder = "Contact number";
        phoneField.value = formValues.phone || "";
        phoneField.autocomplete = "tel";
        phoneField.inputMode = "tel";
        phoneField.addEventListener("input", () => {
          formValues.phone = phoneField.value.trim();
          syncHiddenFields();
          setStatus("");
        });

        const contactWrap = document.createElement("div");
        contactWrap.className = "guided-summary__contact";

        const contactLabel = document.createElement("div");
        contactLabel.className = "guided-summary__label";
        contactLabel.textContent = "Preferred method of contact";

        const contactOptions = document.createElement("div");
        contactOptions.className = "guided-summary__contact-options";

        ["Email", "WhatsApp", "Phone call"].forEach((option) => {
          const optionLabel = document.createElement("label");
          optionLabel.className = "guided-summary__contact-option";

          const input = document.createElement("input");
          input.type = "radio";
          input.name = "quickStartPreferredContactChoice";
          input.value = option;
          input.checked = formValues.preferred_contact === option;
          input.addEventListener("change", () => {
            formValues.preferred_contact = option;
            syncHiddenFields();
            setStatus("");
          });

          const text = document.createElement("span");
          text.textContent = option;

          optionLabel.appendChild(input);
          optionLabel.appendChild(text);
          contactOptions.appendChild(optionLabel);
        });

        fields.appendChild(emailField);
        fields.appendChild(phoneField);
        contactWrap.appendChild(contactLabel);
        contactWrap.appendChild(contactOptions);
        fields.appendChild(contactWrap);
        summary.appendChild(list);
        summary.appendChild(fields);
        bodyEl.appendChild(summary);

        nextBtn.hidden = false;
        nextBtn.disabled = false;
        nextBtn.textContent = "Submit";
        requestAnimationFrame(() => phoneField.focus());
      }

      function renderInputStep(step){
        const field = step.type === "textarea"
          ? document.createElement("textarea")
          : document.createElement("input");

        field.className = step.type === "textarea" ? "guided-textarea" : "guided-input";
        if (step.type !== "textarea") field.type = step.type;
        field.placeholder = step.placeholder || "";
        field.value = getStepValue(step) || "";
        field.autocomplete = step.type === "email" ? "email" : step.type === "tel" ? "tel" : "off";
        if (step.type === "email") field.inputMode = "email";
        if (step.type === "tel") field.inputMode = "tel";

        field.addEventListener("input", () => {
          setStepValue(step, field.value.trim());
          syncHiddenFields();
          setStatus("");
        });

        if (step.type === "email-capture") {
          renderEmailCaptureStep();
          return;
        }

        bodyEl.appendChild(field);

        if (step.key === "other_notes") {
          const uploadWrap = document.createElement("div");
          uploadWrap.className = "guided-upload";

          const uploadButton = document.createElement("label");
          uploadButton.className = "guided-upload__button";
          uploadButton.htmlFor = "quickStartReferenceImages";
          uploadButton.textContent = "Attach images";

          const uploadMeta = document.createElement("p");
          uploadMeta.className = "guided-upload__meta";
          const updateUploadMeta = () => {
            const count = referenceImagesInput?.files ? referenceImagesInput.files.length : 0;
            uploadMeta.textContent = count === 0
              ? "No images attached"
              : count === 1
                ? "1 image attached"
                : `${count} images attached`;
            setStatus("");
          };

          updateUploadMeta();
          referenceImagesInput?.addEventListener("change", updateUploadMeta, { once: true });
          if (referenceImagesInput) {
            referenceImagesInput.onchange = updateUploadMeta;
          }

          if (referenceImagesInput) {
            uploadWrap.appendChild(referenceImagesInput);
          }
          uploadWrap.appendChild(uploadButton);
          uploadWrap.appendChild(uploadMeta);
          bodyEl.appendChild(uploadWrap);
        }

        nextBtn.hidden = false;
        nextBtn.textContent = stepIndex === steps.length - 1 ? "Submit" : "Next";
        requestAnimationFrame(() => field.focus());
      }

      function renderIntroScreen(){
        if (!questionEl || !supportEl || !introEl || !bodyEl || !noteEl || !nextBtn) return;
        updateProgress();
        questionEl.textContent = "";
        if (backBtn) backBtn.hidden = true;
        supportEl.textContent = "We will help you visualise your ring, narrow down the details, and get a more accurate price.";
        designFlowEl?.classList.remove("design-flow--steps");
        shellEl.classList.add("guided-form--intro");
        shellEl.classList.remove("guided-form--metal", "guided-form--email-popup", "guided-form--cathedral-overlay", "guided-form--halo-image", "guided-form--halo-overlay", "guided-form--hidden-halo-overlay", "guided-form--tulip-overlay", "guided-form--tulip-image", "guided-form--classic-image", "guided-form--solitaire-round-image", "guided-form--solitaire-round-plain-image", "guided-form--solitaire-oval-image", "guided-form--solitaire-emerald-image", "guided-form--solitaire-radiant-image", "guided-form--solitaire-princess-image", "guided-form--solitaire-cushion-image", "guided-form--solitaire-pear-image", "guided-form--solitaire-marquise-image", "guided-form--trilogy-image", "guided-form--trilogy-large-centre-image", "guided-form--toi-et-moi-image", "guided-form--cluster-image", "guided-form--style-preview", "guided-form--pave-overlay", "guided-form--pave-overlay-half", "guided-form--image-transforming");
        activeRingImage = "plain";
        if (imageTransformTimer) {
          window.clearTimeout(imageTransformTimer);
          imageTransformTimer = null;
        }
        introEl.classList.remove("guided-form__intro--metal");
        questionEl.classList.remove("guided-form__question--metal");
        supportEl.classList.remove("guided-form__support--metal", "guided-form__support--phone");
        clearMetalTheme();
        renderGuide(null);
        bodyEl.innerHTML = "";
        noteEl.textContent = "";
        nextBtn.hidden = false;
        nextBtn.disabled = false;
        nextBtn.textContent = "Design my ring";
      }

      function renderStep(){
        if (introActive) {
          renderIntroScreen();
          return;
        }
        if (summaryScreenActive) {
          renderSummaryScreen();
          return;
        }
        while (stepIndex < steps.length && !shouldShowStep(steps[stepIndex])) {
          stepIndex += 1;
        }
        const step = steps[stepIndex];
        if (!step || !questionEl || !supportEl || !introEl || !bodyEl || !noteEl || !nextBtn) return;
        updateProgress();
        const hasSelectedMetal = Boolean(formValues.ring_metal);
        const nextRingImage = resolveDisplayedRingImage(step);
        const isEmailCaptureStep = step.type === "email-capture";

        designFlowEl?.classList.add("design-flow--steps");
        shellEl.classList.remove("guided-form--intro");
        questionEl.textContent = isEmailCaptureStep ? "" : getStepLabel(step);
        supportEl.textContent = isEmailCaptureStep ? "" : step.support;
        shellEl.classList.toggle("guided-form--metal", hasSelectedMetal);
        shellEl.classList.toggle("guided-form--email-popup", isEmailCaptureStep);
        shellEl.classList.toggle("guided-form--style-preview", step.key === "multi_stone_style");
        shellEl.classList.toggle("guided-form--cathedral-overlay", nextRingImage === "cathedral");
        shellEl.classList.toggle("guided-form--solitaire-round-image", nextRingImage === "solitaire-round");
        shellEl.classList.toggle("guided-form--solitaire-round-plain-image", nextRingImage === "solitaire-round-plain");
        shellEl.classList.toggle("guided-form--solitaire-oval-image", nextRingImage === "solitaire-oval");
        shellEl.classList.toggle("guided-form--solitaire-emerald-image", nextRingImage === "solitaire-emerald");
        shellEl.classList.toggle("guided-form--solitaire-radiant-image", nextRingImage === "solitaire-radiant");
        shellEl.classList.toggle("guided-form--solitaire-princess-image", nextRingImage === "solitaire-princess");
        shellEl.classList.toggle("guided-form--solitaire-cushion-image", nextRingImage === "solitaire-cushion");
        shellEl.classList.toggle("guided-form--solitaire-pear-image", nextRingImage === "solitaire-pear");
        shellEl.classList.toggle("guided-form--solitaire-marquise-image", nextRingImage === "solitaire-marquise");
        shellEl.classList.toggle("guided-form--halo-image", nextRingImage === "halo");
        shellEl.classList.toggle("guided-form--halo-overlay", shouldShowHaloImage(step) && formValues.style_detail !== "Hidden halo");
        shellEl.classList.toggle("guided-form--hidden-halo-overlay", shouldShowHaloImage(step) && formValues.style_detail === "Hidden halo");
        shellEl.classList.toggle("guided-form--tulip-overlay", false);
        shellEl.classList.toggle("guided-form--tulip-image", shouldShowSettingDesignImage() && formValues.setting_design === "Tulip/Floral");
        shellEl.classList.toggle("guided-form--classic-image", shouldShowSettingDesignImage() && formValues.setting_design === "Classic");
        shellEl.classList.toggle("guided-form--bezel-image", formValues.multi_stone_style === "Bezel");
        shellEl.classList.toggle("guided-form--trilogy-image", nextRingImage === "trilogy");
        shellEl.classList.toggle("guided-form--trilogy-large-centre-image", nextRingImage === "trilogy-large-centre");
        shellEl.classList.toggle("guided-form--toi-et-moi-image", nextRingImage === "toi-et-moi");
        shellEl.classList.toggle("guided-form--cluster-image", nextRingImage === "cluster");
        shellEl.classList.toggle("guided-form--pave-overlay", formValues.pave_band === "Yes" && formValues.pave_coverage !== "Half pave");
        shellEl.classList.toggle("guided-form--pave-overlay-half", formValues.pave_band === "Yes" && formValues.pave_coverage === "Half pave");
        triggerRingImageTransform(nextRingImage);
        renderMobilePreview(step, nextRingImage);
        introEl.classList.toggle("guided-form__intro--metal", hasSelectedMetal);
        questionEl.classList.toggle("guided-form__question--metal", hasSelectedMetal);
        supportEl.classList.toggle("guided-form__support--metal", hasSelectedMetal);
        renderGuide(step);
        if (hasSelectedMetal) {
          applyMetalTheme(formValues.ring_metal);
        } else {
          clearMetalTheme();
        }
        supportEl.classList.toggle("guided-form__support--phone", isEmailCaptureStep);
        noteEl.textContent = "";
        bodyEl.innerHTML = "";
        if (nextBtn && nextBtn.parentElement && nextBtn.parentElement.classList.contains("guided-form__footer")) {
          shellEl.appendChild(nextBtn.parentElement);
        }
        if (backBtn) backBtn.hidden = false;
        nextBtn.hidden = false;
        nextBtn.disabled = false;
        if (step.type === "choice") {
          renderChoiceStep(step);
        } else if (step.type === "multi-choice") {
          renderMultiChoiceStep(step);
        } else if (step.type === "dual-range") {
          renderDualRangeStep(step);
        } else if (step.type === "range") {
          renderRangeStep(step);
        } else {
          renderInputStep(step);
        }
      }

      function submitQuickStart(){
        if (isSubmitting) return;
        isSubmitting = true;
        hasSubmittedLead = true;
        if (hiddenFields.submission_type) hiddenFields.submission_type.value = "complete";
        syncHiddenFields();
        setStatus("");
        nextBtn.disabled = true;
        nextBtn.textContent = "Sending...";
        form.requestSubmit();
      }

      nextBtn.addEventListener("click", () => {
        if (introActive) {
          introActive = false;
          summaryScreenActive = false;
          renderStep();
          return;
        }

        if (summaryScreenActive) {
          const email = String(formValues.email || "").trim();
          const phone = String(formValues.phone || "").trim();
          const preferredContact = String(formValues.preferred_contact || "").trim();
          if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
            setStatus("Please add a valid email address.");
            return;
          }
          if (!phone) {
            setStatus("Please add a contact number.");
            return;
          }
          if (!preferredContact) {
            setStatus("Please choose a preferred contact method.");
            return;
          }
          submitQuickStart();
          return;
        }

        const step = steps[stepIndex];
        if (!step) return;

        if (step.type === "textarea") {
          syncHiddenFields();
          moveToNextStep();
          renderStep();
          return;
        }

        if (step.type === "multi-choice") {
          const selected = String(getStepValue(step) || "").split(",").map((item) => item.trim()).filter(Boolean);
          if (selected.length !== (step.maxSelections || 2)) {
            setStatus(`Please select ${step.maxSelections || 2}.`);
            return;
          }
          syncHiddenFields();
          moveToNextStep();
          renderStep();
          return;
        }

        if (step.type === "dual-range") {
          syncHiddenFields();
          moveToNextStep();
          renderStep();
          return;
        }

        if (step.type === "range") {
          syncHiddenFields();
          moveToNextStep();
          renderStep();
          return;
        }

        if (step.type === "email-capture") {
          summaryScreenActive = true;
          renderSummaryScreen();
        }
      });

      backBtn?.addEventListener("click", () => {
        if (introActive) return;
        if (summaryScreenActive) {
          summaryScreenActive = false;
          renderStep();
          return;
        }
        if (stepIndex <= 0) {
          introActive = true;
          renderIntroScreen();
          return;
        }

        moveToPreviousStep();
        if (stepIndex < 0) {
          introActive = true;
          renderIntroScreen();
          return;
        }

        renderStep();
      });

      if (locationField) {
        fetch("https://ipapi.co/json/")
          .then((response) => response.ok ? response.json() : Promise.reject())
          .then((data) => {
            const countryCode = String(data.country_code || "").toUpperCase();
            if (currencyByCountryCode[countryCode]) {
              visitorCurrency = currencyByCountryCode[countryCode];
              visitorCountryCode = countryCode;
            }
            const location = [data.city, data.region, data.country_name].filter(Boolean).join(", ");
            const currencyLabel = getCurrencyConfig().code;
            locationField.value = [location || "Unknown", `Currency: ${currencyLabel}`, countryCode ? `Country code: ${countryCode}` : ""].filter(Boolean).join(" | ");
            if (!formValues.budget) {
              formValues.budget = String(getCurrencyConfig().min);
              syncHiddenFields();
            }
            if (!introActive && steps[stepIndex]?.key === "budget") {
              renderStep();
            }
          })
          .catch(() => {
            locationField.value = `Unknown | Currency: ${getCurrencyConfig().code} | Country code: ${visitorCountryCode}`;
            if (!formValues.budget) {
              formValues.budget = String(getCurrencyConfig().min);
              syncHiddenFields();
            }
          });
      }

      form.addEventListener("submit", (event) => {
        const email = String(formValues.email || "").trim();
        const phone = String(formValues.phone || "").trim();
        const preferredContact = String(formValues.preferred_contact || "").trim();
        if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          event.preventDefault();
          isSubmitting = false;
          hasSubmittedLead = false;
          nextBtn.disabled = false;
          nextBtn.textContent = "Submit";
          setStatus("Please add a valid email address.");
          return;
        }
        if (!phone) {
          event.preventDefault();
          isSubmitting = false;
          hasSubmittedLead = false;
          nextBtn.disabled = false;
          nextBtn.textContent = "Submit";
          setStatus("Please add a contact number.");
          return;
        }
        if (!preferredContact) {
          event.preventDefault();
          isSubmitting = false;
          hasSubmittedLead = false;
          nextBtn.disabled = false;
          nextBtn.textContent = "Submit";
          setStatus("Please choose a preferred contact method.");
        }
      });

      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden") {
          sendAbandonmentLead();
        }
      });

      window.addEventListener("pagehide", () => {
        sendAbandonmentLead();
      });

      syncHiddenFields();
      if (shouldSkipQuickStartIntro) {
        introActive = false;
        renderStep();
      } else {
        renderIntroScreen();
      }
    })();

    (function handleFaqToggle(){
      const faqSection = document.querySelector(".faq");
      const faqToggle = document.getElementById("faqToggle");
      if (!faqSection || !faqToggle) return;

      faqToggle.addEventListener("click", () => {
        const isOpen = faqSection.classList.toggle("is-open");
        faqToggle.setAttribute("aria-expanded", String(isOpen));
      });
    })();
  </script>
  <script src="scroll-reveal.js"></script>
</body>
</html>
