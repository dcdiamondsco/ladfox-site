<body class="ring-config-page">
  <header class="topbar">
    <div class="shell">
      <div class="brand-lockup">
        <a class="brand" href="index.html" aria-label="Ladfox home">
          <img class="brand-logo" src="Images/ladfox-logo.png" alt="Ladfox" />
        </a>
      </div>
      <div class="actions">
        <a class="btn btn-secondary" href="ring-gallery.html">Back to gallery</a>
        <a class="btn btn-primary" href="consultation.html">Book a consultation</a>
      </div>
    </div>
  </header>

  <main class="page">
    <div class="shell">
      <section class="layout" data-ring-config-page data-product-name="Trilogy Ring" data-product-slug="trilogy-ring">
        <div class="media-column">
          <article class="panel media">
            <div class="media-stage">
              <video class="product-video product-video--zoom-out" src="Videos/Trilogy.mov" poster="Images/trilogy.png" preload="metadata" controls autoplay playsinline muted loop aria-label="Trilogy ring video"></video>
            </div>
          </article>
        </div>

        <article class="panel copy">
          <div class="size-panel">
            <div class="product-form-grid">
              <div class="field">
                <label for="trilogyMetal">Metal</label>
                <div class="field-input">
                  <input class="config-hidden" id="trilogyMetal" type="hidden" data-config-param="metal" value="" />
                  <div class="option-slider" data-option-slider="trilogyMetal" aria-label="Metal">
                    <button class="option-pill option-pill--yellow-gold" type="button" data-option-value="14k Yellow Gold">14k Yellow Gold</button>
                    <button class="option-pill option-pill--yellow-gold" type="button" data-option-value="18k Yellow Gold">18k Yellow Gold</button>
                    <button class="option-pill option-pill--white-gold" type="button" data-option-value="14k White Gold">14k White Gold</button>
                    <button class="option-pill option-pill--white-gold" type="button" data-option-value="18k White Gold">18k White Gold</button>
                    <button class="option-pill option-pill--rose-gold" type="button" data-option-value="14k Rose Gold">14k Rose Gold</button>
                    <button class="option-pill option-pill--rose-gold" type="button" data-option-value="18k Rose Gold">18k Rose Gold</button>
                    <button class="option-pill option-pill--platinum" type="button" data-option-value="Platinum">Platinum</button>
                  </div>
                </div>
              </div>
              <div class="field">
                <label for="trilogyShape">Stone shape</label>
                <div class="field-input">
                  <input class="config-hidden" id="trilogyShape" type="hidden" data-config-param="shape" value="" />
                  <div class="option-slider" data-option-slider="trilogyShape" aria-label="Stone shape">
                    <button class="option-pill" type="button" data-option-value="Round">Round</button>
                    <button class="option-pill" type="button" data-option-value="Oval">Oval</button>
                    <button class="option-pill" type="button" data-option-value="Pear">Pear</button>
                    <button class="option-pill" type="button" data-option-value="Cushion">Cushion</button>
                    <button class="option-pill" type="button" data-option-value="Emerald">Emerald</button>
                    <button class="option-pill" type="button" data-option-value="Radiant">Radiant</button>
                    <button class="option-pill" type="button" data-option-value="Princess">Princess</button>
                    <button class="option-pill" type="button" data-option-value="Marquise">Marquise</button>
                    <button class="option-pill" type="button" data-option-value="Asscher">Asscher</button>
                    <button class="option-pill" type="button" data-option-value="Heart">Heart</button>
                  </div>
                </div>
              </div>
              <div class="field">
                <label for="trilogyStoneSize">Stone size</label>
                <div class="field-input field-input--range">
                  <input class="config-hidden" id="trilogyStoneSize" type="hidden" data-config-param="stone_size" value="" />
                  <div class="range-readout"><span>Selected size</span><strong data-size-output="trilogyStoneSize">0.3 ct</strong></div>
                  <input class="stone-size-range" type="range" min="0.3" max="8" step="0.1" value="0.3" data-size-range="trilogyStoneSize" aria-label="Stone size slider" />
                  <div class="range-scale"><span>0.3 ct</span><span>8.0 ct+</span></div>
                </div>
              </div>
              <div class="field">
                <label for="trilogyColour">Colour</label>
                <div class="field-input">
                  <input class="config-hidden" id="trilogyColour" type="hidden" data-config-param="colour" value="" />
                  <div class="option-slider" data-option-slider="trilogyColour" aria-label="Colour">
                    <button class="option-pill" type="button" data-option-value="D">D</button>
                    <button class="option-pill" type="button" data-option-value="E">E</button>
                    <button class="option-pill" type="button" data-option-value="F">F</button>
                    <button class="option-pill" type="button" data-option-value="G">G</button>
                    <button class="option-pill" type="button" data-option-value="H">H</button>
                    <button class="option-pill" type="button" data-option-value="Not sure">Not sure</button>
                  </div>
                </div>
              </div>
              <div class="field">
                <label for="trilogyClarity">Clarity</label>
                <div class="field-input field-input--range">
                  <input class="config-hidden" id="trilogyClarity" type="hidden" data-config-param="clarity" value="" />
                  <div class="range-readout"><span>Selected clarity</span><strong data-discrete-output="trilogyClarity">Flawless</strong></div>
                  <input class="stone-size-range" type="range" min="0" max="7" step="1" value="0" data-discrete-range="trilogyClarity" data-range-values="Flawless|Internally Flawless|VVS1|VVS2|VS1|VS2|SI1|Not sure" aria-label="Clarity slider" />
                  <div class="range-scale"><span>Flawless</span><span>Not sure</span></div>
                </div>
              </div>
            </div>

            <div class="actions">
              <a class="btn btn-primary" href="ring-form.html" data-config-link>Create your own</a>
            </div>
          </div>
        </article>
      </section>
    </div>
  </main>

  <script src="ring-showcase.js"></script>
</body>
