<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LADFOX Admin</title>
  <meta name="description" content="Secure LADFOX customer project administration." />
  <meta name="robots" content="noindex,nofollow" />
  <meta property="og:image" content="https://ladfox.com/Images/og-banner.jpg" />
  <link rel="canonical" href="https://ladfox.com/ladfox-admin" />
  <link rel="stylesheet" href="assets/site-common.css" />
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#0a0a0a;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:20px}
    .wrap{max-width:980px;margin:0 auto}
    h1{font-size:1.4rem;margin:0 0 14px}
    .card{background:#151515;border:1px solid #2a2a2a;border-radius:14px;padding:18px;margin:0 0 14px}
    input,select,textarea{width:100%;background:#0b0b0b;border:1px solid #333;color:#fff;border-radius:10px;padding:10px 12px;font:inherit}
    textarea{min-height:70px}
    label{display:block;font-size:.78rem;color:#aaa;margin:10px 0 4px}
    button{background:#fff;color:#000;border:0;border-radius:999px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer}
    button.danger{background:#d92b2b;color:#fff}
    button.ghost{background:none;color:#fff;border:1px solid #444}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    @media(max-width:640px){.grid{grid-template-columns:1fr}}
    .tag{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:#aaa}
    .new{background:#ffd36b;color:#000;border-radius:999px;padding:2px 9px;font-size:.72rem;font-weight:700;margin-left:6px}
    .meta{color:#bbb;font-size:.88rem;line-height:1.5;white-space:pre-wrap;word-break:break-word}
    .log{margin-top:10px;max-height:190px;overflow:auto;font-size:.85rem;border-top:1px solid #2a2a2a;padding-top:8px}
    .log div{margin:5px 0;color:#ccc}.log b{color:#fff}
    .hidden{display:none}
    .sec{margin-top:16px;border-top:1px solid #2a2a2a;padding-top:12px}
    .sec h3{margin:0 0 8px;font-size:.95rem}
    .thumbs{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
    .thumb{width:110px;font-size:.72rem;color:#bbb;word-break:break-word}
    .thumb img{display:block;width:110px;height:110px;object-fit:contain;background:#000;border-radius:8px;border:1px solid #333}
    .thumb button{margin-top:4px;padding:4px 10px;font-size:.72rem}
    .pay{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0;font-size:.9rem}
    .pill{border-radius:999px;padding:2px 10px;font-size:.72rem;font-weight:700}
    .pill.paid{background:#9fe3b0;color:#000}.pill.due{background:#ffd36b;color:#000}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
    .row label{margin:0;display:flex;gap:6px;align-items:center;color:#ddd;font-size:.9rem}
    .row input[type=checkbox]{width:auto}
    .facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:8px;margin:14px 0 6px}
    .fact{background:rgba(255,255,255,.05);border-radius:12px;padding:10px 12px}
    .fact span{display:block;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:#8b9099;margin:0 0 3px}
    .fact b{font-weight:600;color:#fff;font-size:.95rem}
    .say{margin:10px 0 6px;padding:12px 14px;background:rgba(255,255,255,.05);border-radius:12px}
    .say span{display:block;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:#8b9099;margin:0 0 4px}
    .say p{margin:0;white-space:pre-wrap;color:#e6e8ec;line-height:1.55}
    .stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin:0 0 16px}
    .stat{background:#151515;border-radius:14px;padding:14px}.stat b{display:block;font-size:1.7rem}.stat span{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:#8b9099}
    .erow{display:flex;gap:12px;align-items:center;background:#151515;border-radius:14px;padding:13px 16px;margin:0 0 8px;cursor:pointer;width:100%;text-align:left;color:#fff;border:0;font:inherit}
    .erow:hover{background:#1d1d1d}.erow .who{flex:1;min-width:0}.erow .who strong{display:block}.erow .who small{display:block;color:#8b9099;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .erow .dot{width:9px;height:9px;border-radius:50%;background:#444;flex:none}.erow .dot.on{background:#9fe3b0}
    .erow .stg{font-size:.72rem;background:rgba(255,255,255,.08);border-radius:999px;padding:3px 10px;white-space:nowrap}
    .erow .nb{font-size:.68rem;font-weight:700;background:#fff;color:#000;border-radius:999px;padding:3px 9px}
    #status{margin:10px 0;color:#9fe3b0;min-height:1.2em}#status.err{color:#ff9d9d}
  </style>
</head>
<body>
<a class="site-skip-link" href="#main-content">Skip to main content</a>
<main id="main-content" class="wrap">
  <h1>LADFOX customer projects</h1>
  <form id="login" class="card">
    <label for="pw">Admin password</label>
    <input id="pw" type="password" autocomplete="current-password" required />
    <div class="row"><button type="submit">Open</button></div>
  </form>
  <div id="status" role="status"></div>
  <div id="app" class="hidden">
    <div class="row" style="margin:0 0 14px"><button class="ghost" id="reload" type="button">Refresh</button><button class="ghost" id="addBtn" type="button">Add an existing order</button><button class="ghost" id="out" type="button">Lock</button></div>
    <form id="addForm" class="card hidden">
      <div class="grid">
        <div><label>Customer email</label><input id="a-email" type="email" required /></div>
        <div><label>Customer name</label><input id="a-name" /></div>
        <div><label>Ring / title</label><input id="a-title" required placeholder="e.g. 2ct oval, 18K white gold" /></div>
        <div><label>Order reference</label><input id="a-ref" /></div>
      </div>
      <label>Details</label><textarea id="a-details"></textarea>
      <div class="row"><label><input type="checkbox" id="a-notify" /> Email them that it's in their account</label><button type="submit">Add</button></div>
    </form>
    <div id="dash">
      <div id="stats" class="stats"></div>
      <div class="row" style="margin:0 0 10px"><input id="q" placeholder="Search name, email or ring" style="max-width:320px" /><select id="flt" style="max-width:200px"><option value="all">All enquiries</option><option value="unread">New messages</option><option value="open">In progress</option><option value="done">Delivered</option></select></div>
      <div id="list"></div>
      <h2 style="margin:26px 0 10px">Signed up, no request yet</h2>
      <div id="activity"></div>
      <details style="margin:26px 0 0"><summary style="cursor:pointer;font-weight:700;font-size:1.1rem">Saved designs (from the website)</summary><div id="designs" style="margin-top:10px"></div></details>
    </div>
    <div id="detail" class="hidden"><button class="ghost" id="back" type="button" style="margin:0 0 12px">&larr; Back to dashboard</button><div id="detailBody"></div></div>
  </div>
</main>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const API = "/.netlify/functions/admin";
  let pw = ""; try { pw = sessionStorage.getItem("lfx_admin") || ""; } catch {}
  let STAGES = [];
  const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c; if (x != null) n.textContent = x; return n; };
  const status = (t, err) => { $("status").textContent = t || ""; $("status").className = err ? "err" : ""; };
  const call = async (body) => {
    const res = await fetch(API, { method: body ? "POST" : "GET", headers: { Authorization: "Bearer " + pw, "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
    let data = {}; try { data = await res.json(); } catch {}
    return { res, data };
  };
  const readB64 = (blob) => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1]); r.onerror = no; r.readAsDataURL(blob); });
  async function prepareFile(file) {
    if (file.type === "application/pdf") {
      if (file.size > 4 * 1024 * 1024) throw new Error("PDF must be under 4 MB.");
      return { type: file.type, data: await readB64(file) };
    }
    if (!/^image\/(jpeg|png|webp)$/.test(file.type)) throw new Error("Use a JPG, PNG, WebP or PDF.");
    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, 1800 / Math.max(bmp.width, bmp.height));
    const cv = document.createElement("canvas"); cv.width = Math.round(bmp.width * scale); cv.height = Math.round(bmp.height * scale);
    const ctx = cv.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height); ctx.drawImage(bmp, 0, 0, cv.width, cv.height);
    const blob = await new Promise((ok) => cv.toBlob(ok, "image/jpeg", 0.88));
    return { type: "image/jpeg", data: await readB64(blob) };
  }
  const fmt = (iso) => new Date(iso).toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });

  function card(p) {
    const c = el("div", "card");
    const head = el("div"); head.append(el("div", "tag", (p.type === "order" ? "Order" : "Design request") + (p.orderReference ? " · " + p.orderReference : "")));
    const t = el("strong", "", p.title); if (p.customerUnread) t.append(el("span", "new", "NEW MESSAGE"));
    head.append(t);
    c.append(head);
    c.append(el("div", "meta", `${p.name ? p.name + " \u00b7 " : ""}${p.email}\nCreated ${fmt(p.createdAt)}`));
    const facts = [], said = [];
    for (const raw of String(p.details || "").split("\n")) {
      const line = raw.trim(); if (!line || /^\[.*\]$/.test(line)) continue;
      const m = line.match(/^([A-Za-z][A-Za-z ]{0,24}):\s*(.+)$/);
      if (m) facts.push([m[1], m[2]]); else said.push(line);
    }
    if (p.budget && !facts.some((x) => x[0] === "Budget")) facts.push(["Budget", p.budget]);
    if (facts.length) {
      const gridF = el("div", "facts");
      for (const [k, v] of facts) { const d = el("div", "fact"); d.append(el("span", "", k.replace(/^Ring is for$/, "For")), el("b", "", v)); gridF.append(d); }
      c.append(gridF);
    }
    if (said.length) { const sy = el("div", "say"); sy.append(el("span", "", "Their message"), el("p", "", said.join("\n"))); c.append(sy); }
    const g = el("div", "grid");
    const sWrap = el("div"); sWrap.append(el("label", "", "Stage"));
    const sel = el("select"); STAGES.forEach((s, i) => { const o = el("option", "", s); o.value = i; if (i === p.stage) o.selected = true; sel.append(o); }); sWrap.append(sel);
    c.append(sWrap);
    const note = { value: "" };
    const row = el("div", "row"); const lab = el("label"); const ck = el("input"); ck.type = "checkbox"; ck.checked = false; lab.append(ck, document.createTextNode("Email them this update"));
    const save = el("button", "", "Save update"); row.append(lab, save);
    save.onclick = async () => {
      save.disabled = true;
      const { res, data } = await call({ action: "update", email: p.email, id: p.id, stage: sel.value, note: note.value, notify: ck.checked, estimate: estIn.value, trackingUrl: trkIn.value });
      save.disabled = false;
      if (!res.ok) return status(data.error || "Failed", true);
      status("");
      load();
    };
    // ----- design files -----
    const fsec = el("div", "sec"); fsec.append(el("h3", "", "Designs & sketches (JPG, PNG, WebP or PDF)"));
    const thumbs = el("div", "thumbs");
    for (const f of p.files || []) {
      const t = el("div", "thumb");
      if (f.type === "application/pdf") { t.append(el("div", "", "PDF")); }
      else {
        const img = el("img"); img.alt = f.name; t.append(img);
        fetch(`/.netlify/functions/account-file?p=${encodeURIComponent(p.id)}&f=${encodeURIComponent(f.id)}&e=${encodeURIComponent(p.email)}`, { headers: { Authorization: "Bearer " + pw } })
          .then((r) => r.ok ? r.blob() : null).then((b) => { if (b) img.src = URL.createObjectURL(b); });
      }
      const cap = f.by === "customer" ? "Added by customer" : (f.note || ""); if (cap) t.append(el("div", "", cap));
      const del = el("button", "ghost", "Remove");
      del.onclick = async () => { if (!confirm("Remove this file?")) return; const { res, data } = await call({ action: "delete-file", email: p.email, id: p.id, fileId: f.id }); if (!res.ok) return status(data.error || "Failed", true); load(); };
      t.append(del); thumbs.append(t);
    }
    fsec.append(thumbs);
    const fileIn = el("input"); fileIn.type = "file"; fileIn.accept = "image/jpeg,image/png,image/webp,application/pdf";
    const fnote = el("input"); fnote.placeholder = "Note for the customer (optional), e.g. Complimentary sketch";
    const frow = el("div", "row"); const flab = el("label"); const fck = el("input"); fck.type = "checkbox"; fck.checked = false; flab.append(fck, document.createTextNode("Email them"));
    const fbtn = el("button", "", "Upload"); frow.append(flab, fbtn);
    fsec.append(fileIn, fnote, frow);
    fbtn.onclick = async () => {
      const file = fileIn.files[0]; if (!file) return status("Choose a file first.", true);
      fbtn.disabled = true; status("");
      try {
        const { type, data } = await prepareFile(file);
        const { res, data: out } = await call({ action: "upload", email: p.email, id: p.id, name: file.name, data, note: fnote.value, notify: fck.checked });
        if (!res.ok) throw new Error(out.error || "Upload failed");
        status(""); load();
      } catch (e) { status(e.message, true); }
      fbtn.disabled = false;
    };
    c.append(fsec);

    // ----- payments -----
    const psec = el("div", "sec"); psec.append(el("h3", "", "Payment"));
    const estIn = el("input"); estIn.placeholder = "Estimated delivery date (shown to customer)"; estIn.value = p.estimate || ""; estIn.maxLength = 80;
    const trkIn = el("input"); trkIn.placeholder = "Tracking link (optional, shown once dispatched)"; trkIn.value = p.trackingUrl || "";
    psec.append(estIn, trkIn);
    for (const pay of p.payments || []) {
      const r = el("div", "pay");
      r.append(el("span", "pill " + (pay.status === "paid" ? "paid" : "due"), pay.status === "paid" ? "PAID" : "DUE"), document.createTextNode(`£${(pay.amountPence / 100).toFixed(2)} · ${pay.label}`));
      if (pay.status !== "paid") {
        const cancel = el("button", "ghost", "Cancel request");
        cancel.onclick = async () => { const { res, data } = await call({ action: "cancel-payment", email: p.email, id: p.id, paymentId: pay.id }); if (!res.ok) return status(data.error || "Failed", true); load(); };
        const manual = el("button", "ghost", "Mark as paid (bank transfer)");
        manual.onclick = async () => { if (!confirm("Mark this as paid?")) return; const { res, data } = await call({ action: "mark-paid", email: p.email, id: p.id, paymentId: pay.id }); if (!res.ok) return status(data.error || "Failed", true); load(); };
        r.append(cancel, manual);
      }
      psec.append(r);
    }
    if (!(p.payments || []).some((x) => x.status === "requested") && !(p.payments || []).some((x) => x.status === "paid")) {
      const prow = el("div", "grid");
      const amt = el("input"); amt.type = "number"; amt.min = "1"; amt.step = "0.01"; amt.placeholder = "£";
      const lab2 = { value: "Full payment" };
      prow.append(amt); psec.append(prow);
      const prow2 = el("div", "row"); const plab = el("label"); const pck = el("input"); pck.type = "checkbox"; pck.checked = false; plab.append(pck, document.createTextNode("Email them"));
      const pbtn = el("button", "", "Request payment"); prow2.append(plab, pbtn); psec.append(prow2);
      pbtn.onclick = async () => {
        const { res, data } = await call({ action: "request-payment", email: p.email, id: p.id, amount: amt.value, label: lab2.value, notify: pck.checked });
        if (!res.ok) return status(data.error || "Failed", true);
        status(""); load();
      };
    }
    c.append(psec);

    const csec = el("div", "sec"); csec.append(el("h3", "", "Message"));
    const msg = el("textarea"); msg.placeholder = "Write a message to the customer"; csec.append(msg);
    const mrow = el("div", "row"); const mlab = el("label"); const mck = el("input"); mck.type = "checkbox"; mck.checked = false; mlab.append(mck, document.createTextNode("Email them"));
    const msend = el("button", "", "Send message"); mrow.append(mlab, msend); csec.append(mrow); c.append(csec);
    msend.onclick = async () => {
      if (!msg.value.trim()) return;
      msend.disabled = true;
      const { res, data } = await call({ action: "message", email: p.email, id: p.id, text: msg.value, notify: mck.checked });
      msend.disabled = false;
      if (!res.ok) return status(data.error || "Could not send.", true);
      status(""); load();
    };
    const log = el("div", "log");
    for (const u of p.updates.filter((x) => x.kind === "msg" || (x.by === "customer" && x.stage === undefined))) { const d = el("div"); d.append(el("b", "", (u.by === "customer" ? "Customer" : "You") + " · " + fmt(u.at) + ": "), document.createTextNode(u.text)); log.append(d); }
    c.append(log);
    c.append(row);
    const dsec = el("div", "sec"); const del = el("button", "danger", "Delete project");
    del.onclick = async () => {
      if (!confirm("Delete \u201c" + p.title + "\u201d for " + p.email + " permanently, including its files? This cannot be undone.")) return;
      del.disabled = true;
      const { res, data } = await call({ action: "delete-project", email: p.email, id: p.id });
      del.disabled = false;
      if (!res.ok) return status(data.error || "Could not delete.", true);
      status(""); load();
    };
    dsec.append(del); c.append(dsec);
    return c;
  }

  let DATA = null;
  const isOn = (iso) => iso && Date.now() - Date.parse(iso) < 5 * 60 * 1000;
  function render() {
    if (!DATA) return;
    const { rows, cs, ago, when, projects } = DATA;
    const m = location.hash.match(/^#p=(.+)$/);
    const cur = m && rows.find((p) => p.id === decodeURIComponent(m[1]));
    $("dash").classList.toggle("hidden", !!cur); $("detail").classList.toggle("hidden", !cur);
    if (cur) { $("detailBody").replaceChildren(card(cur)); window.scrollTo(0, 0); return; }
    const today = new Date().toDateString();
    const stat = (n, l) => { const d = el("div", "stat"); d.append(el("b", "", String(n)), el("span", "", l)); return d; };
    $("stats").replaceChildren(stat(rows.length, "Enquiries"), stat(rows.filter((p) => p.stage < 8).length, "Open"), stat(rows.filter((p) => p.customerUnread).length, "New messages"));
    const q = ($("q").value || "").toLowerCase(), f = $("flt").value;
    const vis = rows.filter((p) => (f === "all" || (f === "unread" && p.customerUnread) || (f === "open" && p.stage < 8) || (f === "done" && p.stage >= 8)) && (!q || (p.title + " " + p.email + " " + (p.name || "")).toLowerCase().includes(q)));
    $("list").replaceChildren(...(vis.length ? vis.map((p) => {
      const u = cs.find((x) => x.email === p.email) || {};
      const b = el("button", "erow"); b.type = "button";
      const w = el("div", "who"); w.append(el("strong", "", p.title || "Enquiry"), el("small", "", (u.name || p.name || p.email) + " \u00b7 " + (u.lastSeenAt ? "seen " + ago(u.lastSeenAt) : "updated " + ago(p.updatedAt))));
      b.append(el("span", "dot" + (isOn(u.lastSeenAt) ? " on" : "")), w);
      if (p.customerUnread) b.append(el("span", "nb", "NEW MESSAGE"));
      b.append(el("span", "stg", STAGES[p.stage] || ""));
      b.onclick = () => { location.hash = "p=" + encodeURIComponent(p.id); };
      return b;
    }) : [el("p", "meta", "Nothing here.")]));
    const none = cs.filter((u) => !projects.some((p) => p.email === u.email));
    $("activity").replaceChildren(...(none.length ? none.map((u) => {
      const r = el("div", "erow"); r.style.cursor = "default";
      const w = el("div", "who"); w.append(el("strong", "", u.name || u.email), el("small", "", (u.name ? u.email + " \u00b7 " : "") + (u.lastSeenAt ? "seen " + ago(u.lastSeenAt) : "signed up " + when(u.createdAt)) + (u.loginCount ? " \u00b7 " + u.loginCount + " login" + (u.loginCount > 1 ? "s" : "") : "")));
      const rm = el("button", "ghost", "Remove"); rm.type = "button";
      rm.onclick = async () => { if (!confirm("Remove " + (u.name || u.email) + " from the dashboard?")) return; const { res, data } = await call({ action: "delete-customer", email: u.email }); if (!res.ok) return status(data.error || "Failed", true); status(""); load(); };
      r.append(el("span", "dot" + (isOn(u.lastSeenAt) ? " on" : "")), w, rm); return r;
    }) : [el("p", "meta", "None.")]));
  }
  window.addEventListener("hashchange", render);

  async function load() {
    const { res, data } = await call();
    if (res.status === 401) { status("Wrong password.", true); $("app").classList.add("hidden"); $("login").classList.remove("hidden"); return; }
    if (!res.ok) return status(data.error || "Could not load.", true);
    STAGES = data.stages;
    const rows = data.projects.sort((a, b) => (b.customerUnread ? 1 : 0) - (a.customerUnread ? 1 : 0) || String(b.updatedAt).localeCompare(String(a.updatedAt)));
    const ago = (iso) => { if (!iso) return ""; const s = Math.max(0, (Date.now() - Date.parse(iso)) / 1000); if (s < 90) return "just now"; if (s < 3600) return Math.round(s / 60) + " min ago"; if (s < 86400) return Math.round(s / 3600) + " hr ago"; return Math.round(s / 86400) + " days ago"; };
    const when = (iso) => iso ? new Date(iso).toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "";
    const cs = (Array.isArray(data.customers) ? data.customers : []).slice().sort((a, b) => String(b.lastSeenAt || b.createdAt).localeCompare(String(a.lastSeenAt || a.createdAt)));
    DATA = { rows, cs, ago, when, projects: data.projects };
    render();
    const ds = Array.isArray(data.designs) ? data.designs : [];
    $("designs").replaceChildren(...(ds.length ? ds.map((d) => {
      const c = el("div", "card", "");
      const head = el("strong", "", (d.title || "Ring") + " \u00b7 " + (d.email || ""));
      const sm = el("p", "meta", d.summary || "");
      const meta = el("p", "meta", (d.name ? d.name + " \u00b7 " : "") + (d.price ? d.price + " \u00b7 " : "") + new Date(d.createdAt).toLocaleString("en-GB") + (d.marketing ? " \u00b7 OK to email offers" : ""));
      c.append(head, sm, meta);
      if (/^\/(classic-solitaire|signature-solitaire|trilogy-ring)\.html\?[A-Za-z0-9%_.=&+~-]*$/.test(d.resumeUrl || "")) { const a = el("a", "", "Open this design"); a.href = d.resumeUrl; a.target = "_blank"; c.append(a); }
      return c;
    }) : [el("p", "meta", "No saved designs yet.")]));
    $("login").classList.add("hidden"); $("app").classList.remove("hidden"); status("");
  }
  $("login").addEventListener("submit", (e) => { e.preventDefault(); pw = $("pw").value; try { sessionStorage.setItem("lfx_admin", pw); } catch {} load(); });
  $("reload").onclick = load;
  $("back").onclick = () => { location.hash = ""; };
  $("q").oninput = render; $("flt").onchange = render;
  $("out").onclick = () => { pw = ""; try { sessionStorage.removeItem("lfx_admin"); } catch {} location.reload(); };
  $("addBtn").onclick = () => $("addForm").classList.toggle("hidden");
  $("addForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const { res, data } = await call({ action: "create", email: $("a-email").value, name: $("a-name").value, title: $("a-title").value, orderReference: $("a-ref").value, details: $("a-details").value, notify: $("a-notify").checked });
    if (!res.ok) return status(data.error || "Failed", true);
    e.target.reset(); e.target.classList.add("hidden"); status(""); load();
  });
  if (pw) load();
})();
</script>
</body>
</html>
